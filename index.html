  const iso = (x, y, z) => [(x - y) * C, (x + y) * S - z];
  const mtx = (a, b, c, d, e, f) => "matrix(" + [n4(a), n4(b), n4(c), n4(d), n2(e), n2(f)].join(" ") + ")";
  const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");

  // ---- flat shapes, written in a face's own coordinates ----
  const rect = (cls, x, y, w, h, rx) => '<rect class="' + cls + '" x="' + n2(x) + '" y="' + n2(y) + '" width="' + n2(w) + '" height="' + n2(h) + '"' + (rx ? ' rx="' + n2(rx) + '"' : "") + "/>";
  const circ = (cls, x, y, r) => '<circle class="' + cls + '" cx="' + n2(x) + '" cy="' + n2(y) + '" r="' + n2(r) + '"/>';
  const seg = (cls, x1, y1, x2, y2) => "<line" + (cls ? ' class="' + cls + '"' : "") + ' x1="' + n2(x1) + '" y1="' + n2(y1) + '" x2="' + n2(x2) + '" y2="' + n2(y2) + '"/>';
  const path = (cls, d) => '<path class="' + cls + '" d="' + d + '"/>';
  const text = (cls, x, y, str, size) => "<text" + (cls ? ' class="' + cls + '"' : "") + ' x="' + n2(x) + '" y="' + n2(y) + '" font-size="' + n2(size) + '" text-anchor="middle">' + esc(str) + "</text>";

  const port = {
    rj: (u, v) => rect("p-shell", u, v, 16, 13.5, 1) +
      path("p-hole", "M" + n2(u + 2) + " " + n2(v + 2) + "h12v6.4h-2.6v3.1h-6.8v-3.1h-2.6z") +
      rect("p-led a", u + 1.6, v + 10.4, 2, 1.5) + rect("p-led g", u + 12.4, v + 10.4, 2, 1.5),
    usb: (u, v) => rect("p-shell", u, v, 13.5, 6, 0.8) + rect("p-hole", u + 1.1, v + 1.1, 11.3, 3.8) + rect("p-tongue", u + 2, v + 2.8, 9.5, 1.4),
    hdmi: (u, v) => path("p-shell", "M" + n2(u) + " " + n2(v) + "h15v3.6l-2.2 2.6h-10.6l-2.2-2.6z") +
      path("p-hole", "M" + n2(u + 1.3) + " " + n2(v + 1.2) + "h12.4v1.9l-1.5 1.8h-9.4l-1.5-1.8z"),
    usbc: (u, v) => rect("p-shell", u, v, 9.4, 4, 2) + rect("p-hole", u + 1.2, v + 1.2, 7, 1.6, 0.8),
    jack: (u, v) => circ("p-shell", u, v, 3.6) + circ("p-hole", u, v, 2.3) + circ("p-pin", u, v, 0.8),
    dp: (u, v) => path("p-shell", "M" + n2(u) + " " + n2(v) + "h8.6v5.4h-7l-1.6-1.6z") + path("p-hole", "M" + n2(u + 1.1) + " " + n2(v + 1.1) + "h6.4v3.2h-5.2l-1.2-1.2z"),
    led: (u, v, k) => circ("p-led " + (k || "g"), u, v, 1.1),
  };

  // A curved vent slot: the part of a ring between two angles (degrees).
  const arcSlot = (cx, cy, r1, r2, a0, a1) => {
    const k = Math.PI / 180, X = (t, q) => n2(cx + q * Math.cos(t * k)), Y = (t, q) => n2(cy + q * Math.sin(t * k));
    return path("d-slot", "M" + X(a0, r1) + " " + Y(a0, r1) + "A" + n2(r1) + " " + n2(r1) + " 0 0 1 " + X(a1, r1) + " " + Y(a1, r1) +
      "L" + X(a1, r2) + " " + Y(a1, r2) + "A" + n2(r2) + " " + n2(r2) + " 0 0 0 " + X(a0, r2) + " " + Y(a0, r2) + "Z");
  };
  const fan = (cx, cy, r) => {
    let s = circ("p-shell", cx, cy, r) + circ("p-hole", cx, cy, r * 0.9);
    const X = (t, q) => n2(cx + q * Math.cos(t)), Y = (t, q) => n2(cy + q * Math.sin(t));
    const ri = r * 0.3, ro = r * 0.84;
    for (let i = 0; i < 9; i++) {
      const a = (i * 2 * Math.PI) / 9;
      s += path("p-blade", "M" + X(a, ri) + " " + Y(a, ri) + "L" + X(a + 0.62, ro) + " " + Y(a + 0.62, ro) +
        "A" + n2(ro) + " " + n2(ro) + " 0 0 1 " + X(a + 0.98, ro) + " " + Y(a + 0.98, ro) + "L" + X(a + 0.45, ri) + " " + Y(a + 0.45, ri) + "Z");
    }
    return s + circ("p-hub", cx, cy, r * 0.3) + circ("p-hole", cx, cy, r * 0.07);
  };

  // ---- the scene ----
  function Scene() {
    const ground = [], sil = [], body = [], marks = [];
    const bb = [1e9, 1e9, -1e9, -1e9];
    let ox = 0, oy = 0, oz = 0, k = 1, muted = false, lifted = false;
    const Q = (x, y, z) => {
      const p = iso(ox + k * x, oy + k * y, oz + k * (z || 0));
      if (p[0] < bb[0]) bb[0] = p[0];
      if (p[1] < bb[1]) bb[1] = p[1];
      if (p[0] > bb[2]) bb[2] = p[0];
      if (p[1] > bb[3]) bb[3] = p[1];
      return p;
    };
    const pts = (a) => a.map((p) => n2(p[0]) + "," + n2(p[1])).join(" ");
    const poly = (cls, a) => "<polygon" + (cls ? ' class="' + cls + '"' : "") + ' points="' + pts(a) + '"/>';
    const org = (x, y, z) => [(ox + k * x - oy - k * y) * C, (ox + k * x + oy + k * y) * S - oz - k * z];
    const tTop = (x, y, z) => { const o = org(x, y, z); return mtx(C * k, S * k, -C * k, S * k, o[0], o[1]); };   // flat on a floor: u along x, v along y
    const tLeft = (x, y, z) => { const o = org(x, y, z); return mtx(C * k, S * k, 0, k, o[0], o[1]); };    // wall facing the left-front: u along x, v down
    const tRight = (x, y, z) => { const o = org(x, y, z); return mtx(C * k, -S * k, 0, k, o[0], o[1]); };  // wall facing the right-front: u toward the back, v down
    const tBack = (x, y, z) => { const o = org(x, y, z); return mtx(C * k, -S * k, C * k, S * k, o[0], o[1]); };   // flat on a floor, read along the y axis
    const g = (t, inner) => '<g transform="' + t + '">' + inner + "</g>";

    const api = {
      // Move the drawing origin, and optionally draw what follows at another scale.
      at(x, y, z, scale) { ox = x || 0; oy = y || 0; oz = z || 0; k = scale || 1; return api; },
      mute(v) { muted = v !== false; return api; },
      // When objects stand on a drawn floor, their shadows must be painted over it.
      lift(v) { lifted = v !== false; return api; },
      pt: Q, poly, tTop, tLeft, tRight,
      raw(svg) { body.push(svg); return api; },
      under(svg) { sil.push(svg); return api; },
      box(x, y, z, w, d, h, mat, o) {
        o = o || {};
        const A = Q(x, y, z + h), B = Q(x + w, y, z + h), Cc = Q(x + w, y + d, z + h), D = Q(x, y + d, z + h);
        const E = Q(x + w, y, z), F = Q(x + w, y + d, z), G = Q(x, y + d, z);
        const m = " m-" + mat;
        body.push(poly("fl" + m, [D, Cc, F, G]) + poly("fr" + m, [Cc, B, E, F]) + poly("ft" + m, [A, B, Cc, D]));
        if (o.sil !== false) sil.push(poly("", [A, B, E, F, G, D]));
        const h2 = {
          left(inner) { body.push(g(tLeft(x, y + d, z + h), inner)); return h2; },
          right(inner) { body.push(g(tRight(x + w, y + d, z + h), inner)); return h2; },
          top(inner) { body.push(g(tTop(x, y, z + h), inner)); return h2; },
        };
        return h2;
      },
      plane(x, y, z, inner) { body.push(g(tTop(x, y, z), inner)); return api; },
      shadow(x, y, w, d, e) {
        e = e == null ? 4 : e;
        const f = 7;
        (lifted ? body : ground).push(poly("il-shadow", [Q(x - e + f, y - e + f, 0), Q(x + w + e + f, y - e + f, 0), Q(x + w + e + f, y + d + e + f, 0), Q(x - e + f, y + d + e + f, 0)]));
        return api;
      },
      guide(a, b) { const p = Q(a[0], a[1], a[2]), q = Q(b[0], b[1], b[2]); body.push(seg("il-guide", p[0], p[1], q[0], q[1])); return api; },
      // A cable or a flow line laid on the floor through the given [x, y] points.
      run(points, cls) { body.push('<polyline class="' + (cls || "il-wire") + '" points="' + pts(points.map((p) => Q(p[0], p[1], p[2] || 0))) + '"/>'); return api; },
      mark(n, at, off) { if (!muted) marks.push({ n, p: Q(at[0], at[1], at[2]), off }); return api; },
      dimX(x0, x1, y, label) {
        Q(x0, y - 5, 0); Q(x1, y + 15, 0);
        body.push('<g class="il-dim">' + g(tTop(0, 0, 0), seg("", x0, y, x1, y) + seg("", x0, y - 4, x0, y + 4) + seg("", x1, y - 4, x1, y + 4)) +
          g(tTop((x0 + x1) / 2, y, 0), text("", 0, 12, label, 9.5)) + "</g>");
        return api;
      },
      dimY(y0, y1, x, label) {
        Q(x - 5, y0, 0); Q(x + 15, y1, 0);
        body.push('<g class="il-dim">' + g(tTop(0, 0, 0), seg("", x, y0, x, y1) + seg("", x - 4, y0, x + 4, y0) + seg("", x - 4, y1, x + 4, y1)) +
          g(tBack(x, (y0 + y1) / 2, 0), text("", 0, 12, label, 9.5)) + "</g>");
        return api;
      },
      svg(o) {
        o = o || {};
        let x0 = bb[0], y0 = bb[1], x1 = bb[2], y1 = bb[3];
        const ratio = o.ratio == null ? 4 / 3 : o.ratio;
        const span = ratio ? Math.max(x1 - x0, (y1 - y0) * ratio) : Math.max(x1 - x0, y1 - y0);
        const R = span * (o.mark || 0.03);
        let ms = "";
        if (o.marks !== false) marks.forEach((m) => {
          const c = [m.p[0] + m.off[0] * R, m.p[1] + m.off[1] * R];
          ms += '<g class="il-mark">' + seg("", m.p[0], m.p[1], c[0], c[1]) + circ("dot", m.p[0], m.p[1], R * 0.2) + circ("disc", c[0], c[1], R) +
            '<text x="' + n2(c[0]) + '" y="' + n2(c[1]) + '" font-size="' + n2(R * 1.18) + '" text-anchor="middle" dominant-baseline="central">' + m.n + "</text></g>";
          x0 = Math.min(x0, c[0] - R * 1.15); x1 = Math.max(x1, c[0] + R * 1.15);
          y0 = Math.min(y0, c[1] - R * 1.15); y1 = Math.max(y1, c[1] + R * 1.15);
        });
        const pad = span * (o.pad == null ? 0.06 : o.pad);
        x0 -= pad; y0 -= pad; x1 += pad; y1 += pad;
        let w = x1 - x0, h = y1 - y0;
        if (ratio) {
          if (w / h < ratio) { const nw = h * ratio; x0 -= (nw - w) / 2; w = nw; }
          else { const nh = w / ratio; y0 -= (nh - h) / 2; h = nh; }
        }
        return '<svg class="il' + (o.cls ? " " + o.cls : "") + '" viewBox="' + [n2(x0), n2(y0), n2(w), n2(h)].join(" ") + '"' +
          (o.label ? ' role="img" aria-label="' + esc(o.label) + '"' : ' aria-hidden="true"') + ">" +
          ground.join("") + '<g class="il-sil">' + sil.join("") + "</g>" + body.join("") + ms + "</svg>";
      },
    };
    return api;
  }

  // Cooling fins that run along y, painted back to front.
  const fins = (s, x, y, z, w, d, h, n, mat) => {
    const p = w / n, t = p * 0.46;
    for (let i = 0; i < n; i++) s.box(x + i * p + (p - t) / 2, y, z, t, d, h, mat || "steel");
  };
  // Parts that sit on one surface, painted from the far corner to the near one.
  const place = (s, list) => list.slice().sort((a, b) => a[0] + a[1] + (a[3] + a[4]) / 2 - (b[0] + b[1] + (b[3] + b[4]) / 2))
    .forEach((p) => { const b = s.box(p[0], p[1], p[2], p[3], p[4], p[5], p[6], { sil: false }); if (p[7]) b.top(p[7]); });

  // ------------------------------------------------------------------
  // Devices. Each one draws into a scene and registers its numbered marks.
  // ------------------------------------------------------------------

  // A mini-PC seen from the rear, so the sockets show.
  function miniPC(s, a) {
    const W = a.wide ? 150 : 128, D = 128, H = 42, lan = a.lan || (a.wide ? 2 : 1);
    s.shadow(0, 0, W, D);
    const b = s.box(0, 0, 0, W, D, H, "case");
    let top = rect("d-line", 5, 5, W - 10, D - 10, 8);
    if (a.vent === "ring") {
      for (let k = 0; k < 4; k++) for (let i = 0; i < 6; i++) top += arcSlot(W / 2, D / 2, 11 + k * 8.5, 14.6 + k * 8.5, i * 60 + 6, i * 60 + 54);
    } else if (a.vent === "bands") {
      for (let r = 0; r < 2; r++) for (let c = 0; c < 9; c++) top += rect("d-slot", 22 + c * (W - 44) / 9, 18 + r * 58, 3.2, 34, 1.6);
    } else {
      for (let r = 0; r < 5; r++) for (let c = 0; c < 7; c++) top += rect("d-slot", W / 2 - 38 + c * 11.4, 22 + r * 7, 8, 2.6, 1.3);
    }
    b.top(top);
    let side = seg("d-line", 0, H - 5, D, H - 5);
    for (let i = 0; i < 12; i++) side += rect("d-slot", 18 + i * 8.4, 11, 3, 15, 1.5);
    b.right(side);
    const total = 20 * lan + 19 + 21 + 19.5 + 9;
    let u = (W - total) / 2, L = seg("d-line", 0, H - 5, W, H - 5);
    const m = {};
    m.lan = u + (20 * lan - 4) / 2;
    for (let i = 0; i < lan; i++) { L += port.rj(u, 14.5); u += 20; }
    m.video = u + 17;
    L += port.hdmi(u, 19); u += 19; L += port.hdmi(u, 19); u += 21;
    m.usb = u + 6.75;
    L += port.usb(u, 12.5) + port.usb(u, 22); u += 19.5;
    m.power = u + 3.6;
    L += port.jack(u + 3.6, 22);
    b.left(L);
    s.mark(1, [W * 0.76, D * 0.18, H], [1.9, -2.5]);
    s.mark(2, [m.lan, D, H - 21], [-1.5, 3.3]);
    s.mark(3, [m.video, D, H - 22], [-1.5, 3.3]);
    s.mark(4, [m.usb, D, H - 20], [-1.5, 3.3]);
    s.mark(5, [m.power, D, H - 22], [-1.5, 3.3]);
  }

  // The Edge Box as the summaries specify it, opened up: base, board, card and finned lid.
  function edgeBox(s) {
    const W = 128, D = 128, zb = 22, z1 = 25, zc = 84, zl = 142, B = 6;
    s.shadow(0, 0, W, D);
    const tray = s.box(0, 0, 0, W, D, 12, "case");
    tray.top(rect("d-floor", 5, 5, W - 10, D - 10, 6) +
      [[12, 12], [116, 12], [12, 116], [116, 116]].map((p) => circ("p-shell", p[0], p[1], 3.2) + circ("p-hole", p[0], p[1], 1.2)).join(""));
    s.guide([0, D, 12], [0, D, zl]).guide([W, 0, 12], [W, 0, zl]);

    // main board: the far middle stays clear, because the lifted card hangs in front of it
    s.box(B, B, zb, 116, 116, 3, "pcb");
    s.plane(B, B, z1,
      path("d-trace", "M40 44h14v-22M40 52h20M25 64v6M46 80h10v12M70 60v24h-6M18 30v-8h14M30 14h22") +
      rect("d-silk", 87, 8, 24, 84, 1.5) + circ("p-shell", 99, 95.5, 2.8) + circ("p-hole", 99, 95.5, 1.1));
    s.box(B + 88, B + 2, z1, 22, 6, 5, "dark", { sil: false });
    place(s, [
      [B + 10, B + 8, z1, 5, 5, 4.5, "tan"], [B + 18, B + 8, z1, 5, 5, 4.5, "tan"], [B + 10, B + 18, z1, 13, 8, 2.4, "chip"],
      [B + 60, B + 8, z1, 20, 52, 2.5, "pcb2"],
    ]);
    for (let i = 0; i < 4; i++) s.box(B + 64, B + 11 + i * 12, z1 + 2.5, 12, 9, 1.6, "chip", { sil: false });
    s.box(B + 10, B + 34, z1, 30, 30, 4, "chip", { sil: false }).top(text("il-t", 15, 17.6, "CPU", 7.5) + circ("p-pin", 4, 26, 1.1));
    s.box(B + 10, B + 70, z1, 46, 20, 2.5, "pcb2", { sil: false }).top(rect("p-label", 5, 3.5, 28, 13, 1));
    const yb = 124;
    const blk = (x, w, d, h, inner) => s.box(B + x, yb - d, z1, w, d, h, "steel", { sil: false }).left(inner);
    blk(8, 17.5, 21, 14.5, port.rj(0.75, 0.5));
    blk(28.5, 17.5, 21, 14.5, port.rj(0.75, 0.5));
    blk(52, 17, 12, 7.5, port.hdmi(1, 0.7));
    blk(75, 15, 18, 15.5, port.usb(0.75, 1.2) + port.usb(0.75, 8.6));
    blk(97, 10, 13, 10, port.jack(5, 5.2));

    // accelerator card, lifted above its socket
    const cx = B + 88, cy = B + 9;
    s.guide([cx + 22, cy, z1], [cx + 22, cy, zc]).guide([cx + 22, cy + 82, z1], [cx + 22, cy + 82, zc]).guide([cx, cy + 82, z1], [cx, cy + 82, zc]);
    const card = s.box(cx, cy, zc, 22, 82, 2.6, "hi");
    let pads = "";
    for (let u = 1.4; u < 20.5; u += 1.9) if (u < 13.5 || u > 17) pads += rect("p-gold", u, 0.6, 1, 5.4);
    card.top(pads + path("p-shell", "M7.6 82a3.4 3.4 0 0 1 6.8 0z"));
    s.box(cx + 2.5, cy + 24, zc + 2.6, 17, 17, 3, "chip", { sil: false }).top(text("il-t", 8.5, 10.6, "AI", 6.5));
    place(s, [[cx + 4, cy + 48, zc + 2.6, 8, 7, 2, "chip"], [cx + 14, cy + 50, zc + 2.6, 4, 6, 2, "tan"], [cx + 5, cy + 62, zc + 2.6, 4, 6, 2, "tan"], [cx + 13, cy + 64, zc + 2.6, 5, 5, 2.4, "dark"]]);

    // finned lid, the heat sink of a box with no fan
    const lid = s.box(0, 0, zl, W, D, 30, "case");
    lid.left(rect("p-hole", B + 8, 10, 17.5, 15, 1) + rect("p-hole", B + 28.5, 10, 17.5, 15, 1) + rect("p-hole", B + 52, 16, 17, 8.5, 1) +
      rect("p-hole", B + 75, 9, 15, 16.5, 1) + circ("p-hole", B + 102, 20, 4.4));
    lid.right(seg("d-line", 0, 25, D, 25));
    fins(s, 7, 7, zl + 30, W - 14, D - 14, 10, 11, "case");

    s.mark(1, [W - 14, 16, zl + 40], [2.3, -1.9]);
    s.mark(2, [cx + 20, cy + 14, zc + 2.6], [4.4, -0.9]);
    s.mark(3, [cx + 12, cy + 72, z1], [5.0, 3.4]);
    s.mark(4, [B + 27, yb, z1 + 7], [-2.3, 2.9]);
    s.mark(5, [B + 22, B + 44, z1 + 4], [-3.4, -1.9]);
  }

  // An M.2 accelerator card, drawn at three times life size.
  function m2(s, a) {
    const L = a.len * 3, Wd = 66, T = 3.2, cy = Wd / 2, long = a.len > 60;
    s.shadow(0, 0, L, Wd, 3);
    // the board, with its mounting notch and its key slot
    const topD = "M0 0H" + L + "V46h-9v5.4h9V" + Wd + "H0V" + (cy + 8) + "A8 8 0 0 0 0 " + (cy - 8) + "Z";
    const sides = s.poly("fl m-pcb2", [s.pt(0, Wd, T), s.pt(L, Wd, T), s.pt(L, Wd, 0), s.pt(0, Wd, 0)]) +
      s.poly("fr m-pcb2", [s.pt(L, 46, T), s.pt(L, 0, T), s.pt(L, 0, 0), s.pt(L, 46, 0)]) +
      s.poly("fr m-pcb2", [s.pt(L, Wd, T), s.pt(L, 51.4, T), s.pt(L, 51.4, 0), s.pt(L, Wd, 0)]);
    const top = '<g transform="' + s.tTop(0, 0, T) + '">' + path("ft m-pcb2", topD) + "</g>";
    s.pt(0, 0, T);
    s.under(sides + top).raw(sides + top);
    let flat = path("p-gold", "M0 " + (cy + 11.5) + "A11.5 11.5 0 0 0 0 " + (cy - 11.5) + "V" + (cy - 8) + "A8 8 0 0 1 0 " + (cy + 8) + "Z");
    for (let v = 2.4; v < Wd - 2; v += 2.05) if (v < 44.4 || v > 52) flat += rect("p-gold", L - 8.6, v, 8, 1.15);
    s.plane(0, 0, T, flat);

    const cx = a.ram ? 62 : long ? 98 : 40, cs = long ? 48 : 44, c0 = (Wd - cs) / 2;
    const parts = [];
    const cap = (x, y) => parts.push([x, y, T, 6, 3.6, 2.6, "tan"]);
    if (long) {
      [[cx - 16, 12], [cx - 16, 21], [cx - 16, 47], [cx - 30, 47]].forEach((p) => cap(p[0], p[1]));
      if (cx > 80) parts.push([cx - 62, 13, T, 16, 12, 3, "chip"], [cx - 60, 40, T, 11, 11, 5.5, "dark"]);
      if (!a.ram) {
        [[cx + 56, 12], [cx + 56, 21], [cx + 56, 47], [cx + 70, 47]].forEach((p) => cap(p[0], p[1]));
        parts.push([cx + 72, 12, T, 18, 13, 3, "chip"], [cx + 98, 28, T, 12, 12, 6, "dark"]);
      } else {
        parts.push([cx + 62, 11, T, 34, 44, 4, "chip", text("il-t", 17, 24.6, "RAM", 7.5)]);
        [[cx + 104, 14], [cx + 104, 24], [cx + 104, 46]].forEach((p) => cap(p[0], p[1]));
        parts.push([cx + 118, 26, T, 12, 12, 6, "dark"]);
      }
    } else {
      [[24, 12], [24, 50], [92, 13], [92, 22], [94, 48]].forEach((p) => cap(p[0], p[1]));
      parts.push([16, 23, T, 13, 16, 3, "chip"], [102, 30, T, 9, 12, 3, "chip"]);
    }
    if (a.sink) {

    const all = D.rings.map((r) => "<div><dt>" + pips(r.id) + esc(nm(r)) + "</dt><dd>" + html(desc(r)) + "</dd></div>").join("") + '<div><dt><span class="vs" aria-hidden="true"></span>' + esc(nm(D.rival)) + "</dt><dd>" + html(desc(D.rival)) + "</dd></div>";
    return band(th("src_h1"), th("src_sub")) +
      body('<section class="sec"><h2>' + th("how_h") + '</h2><div class="how"><p>' + th("how_scope") + "</p><p>" + th("how_rel") + "</p><p>" + th("how_new", { date: fdate(D.meta.newSince) }) + "</p><p>" + th("how_fig") + "</p><p>" + th("how_money") + "</p><p>" + th("how_photo") + "</p><p>" + th(LIVE ? "how_update_auto" : "how_update") + "</p><p>" + th("how_legal") + "</p><p>" + th("how_ar") + "</p></div></section>" +
        '<section class="sec"><h2>' + th("defs_rings_h") + '</h2><dl class="defs">' + all + "</dl></section>" +
        '<section class="sec"><h2>' + th("defs_act_h") + '</h2><dl class="defs">' + ["act", "evaluate", "watch"].map((a) => "<div><dt>" + esc(t("act_" + a)) + "</dt><dd>" + th("act_" + a + "_d") + "</dd></div>").join("") + "</dl></section>" +
        '<section class="sec"><h2>' + th("cmp_h") + '</h2><p class="sub">' + th("cmp_sub") + "</p>" + cmp + "</section>" +
        '<section class="sec"><h2>' + th("gaps_h") + '</h2><ul class="gaps">' + D.gaps.map((g) => "<li>" + H(g) + "</li>").join("") + "</ul></section>" +
        '<section class="sec"><h2>' + th("srclist_h") + '</h2><div class="srcgroups">' + list + "</div></section>");
  };

  // ---------- search across the whole site ----------
  function searchBody() {
    const terms = norm(ui.q).split(/\s+/).filter(Boolean);
    if (!terms.length) return '<p class="empty"><strong>' + th("gs_empty_h") + "</strong>" + th("gs_empty_p") + "</p>";
    const hit = (x) => terms.every((w) => x._hay.indexOf(w) !== -1);
    const its = D.items.filter(hit), sigs = D.signals.filter(hit), cos = D.companies.filter(hit), vids = D.videos.filter(hit), talks = D.talk.filter(hit);
    if (!its.length && !sigs.length && !cos.length && !vids.length && !talks.length) return '<p class="empty"><strong>' + th("gs_none_h", { q: ui.q }) + "</strong>" + th("gs_none_p") + "</p>";
    const sec = (key, n, inner) => (n ? '<section class="sec found"><h2>' + th(key) + "<span>" + n + "</span></h2>" + inner + "</section>" : "");
    return sec("nav_tech", its.length, relList(its.slice(0, 30).map((x) => x.id))) +
      sec("nav_news", sigs.length, sigLinks(sigs.slice(0, 30))) +
      sec("nav_market", cos.length, '<p class="chips">' + cos.map((c) => goLink("c-" + c.id, latin(c.name), "chip")).join("") + "</p>") +
      sec("vt_videos", vids.length, vidList(vids)) +
      sec("vt_talk", talks.length, talkList(talks));
  }
  R.search = () => band(th("gs_h1"), ui.q.trim() ? th("gs_for", { q: ui.q.trim() }) : "") + body('<div id="found" class="sec">' + searchBody() + "</div>");

  // ---------- frame ----------
  function renderChrome() {
    root.lang = lang;
    root.dir = lang === "ar" ? "rtl" : "ltr";
    $$("[data-i18n]").forEach((el) => { el.innerHTML = th(el.getAttribute("data-i18n")); });
    $("#brand").textContent = t("brand");
    $("#lang-group").setAttribute("aria-label", t("lang_label"));
    $("#lang-en").setAttribute("aria-pressed", String(lang === "en"));
    $("#lang-ar").setAttribute("aria-pressed", String(lang === "ar"));
    $("#theme-text").textContent = t("theme_" + theme);
    $("#theme").title = t("theme_" + theme);
    const gq = $("#gq");
    gq.placeholder = t("gs_ph");
    if (gq.value !== ui.q && document.activeElement !== gq) gq.value = ui.q;
    const link = (p) => '<li><a href="#' + p + '" data-go="' + p + '"' + (route.page === p ? ' aria-current="page"' : "") + ">" + th("nav_" + p) + "</a></li>";
    const nav = $("#nav");
    nav.setAttribute("aria-label", t("nav_label"));
    nav.innerHTML = '<ul class="nav-main">' + PAGES.map(link).join("") + '<li class="more" id="more"><button type="button" class="more-btn" id="more-btn" aria-expanded="false">' + th("nav_more") + '</button><ul class="more-list">' + MORE.map(link).join("") + "</ul></li></ul>";
    $("#foot").innerHTML = LIVE ? th("foot_auto", { date: fdate(D.meta.scanDate, true) }) : th("foot", { n: D.meta.scan, date: fdate(D.meta.scanDate, true) });
    $("#foot-nav").innerHTML = MORE.map((p) => goLink(p, th("nav_" + p))).join("");
  }
  function render() {
    renderChrome();
    $("#main").innerHTML = route.item ? R.item(item[route.item]) : R[route.page]();
    if (route.item) return;
    if (route.page === "news") drawFeed();
    if (route.page === "tech") drawTech();
    if (route.page === "radar") {
      // on a narrow screen the chart scrolls sideways, so start it in the middle
      const host = $("#radar-host"), spare = host.scrollWidth - host.clientWidth;
      if (spare > 2) host.scrollLeft = ((lang === "ar" ? -1 : 1) * spare) / 2;
    }
  }
  // Redraw the page in place after a choice on it, and put the keyboard focus back where it was.
  function redraw() {
    const id = document.activeElement && document.activeElement.id;
    render();
    const el = id && document.getElementById(id);
    if (el) { try { el.focus({ preventScroll: true }); } catch (e) { /* focus is a convenience */ } }
  }
  function applyTheme() {
    if (theme === "auto") { if (hostTheme) root.setAttribute("data-theme", hostTheme); else root.removeAttribute("data-theme"); }
    else root.setAttribute("data-theme", theme);
  }
  function closeMenu() {
    $("#top").classList.remove("open");
    $("#menu-btn").setAttribute("aria-expanded", "false");
    const more = $("#more");
    if (more) { more.classList.remove("open"); $("#more-btn").setAttribute("aria-expanded", "false"); }
  }

  // ---------- moving between pages ----------
  const keyless = (h) => String(h || "").replace(/^#/, "").split("&").filter((x) => !/^(staticrypt_pwd=|remember_me)/.test(x)).join("&");
  function parse(tok) {
    tok = keyless(tok);
    if (!tok) return { page: "start" };
    if (ALIAS[tok]) tok = ALIAS[tok];
    if (VTABS.indexOf(tok) !== -1) return { page: "videos", vtab: tok };
    if (tok.indexOf("box-") === 0 && TIERS.indexOf(tok.slice(4)) !== -1) return { page: "idea", tier: tok.slice(4) };
    if (PAGES.indexOf(tok) !== -1 || MORE.indexOf(tok) !== -1 || tok === "search") return { page: tok };
    let m;
    if ((m = /^tech-([a-z0-9-]+)$/.exec(tok)) && groupOf[m[1]]) return { page: "tech", group: m[1] };
    if ((m = /^(?:t|device)-([a-z0-9-]+)$/.exec(tok)) && item[m[1]]) return { page: "tech", item: m[1] };
    if ((m = /^c-([a-z0-9-]+)$/.exec(tok)) && comp[m[1]]) return { page: "market", company: m[1] };
    if ((m = /^s-([a-z0-9-]+)$/.exec(tok)) && byId[m[1]]) return { page: "news", signal: m[1] };
    if ((m = /^q-([a-z0-9-]+)$/.exec(tok)) && taskOf[m[1]]) return { page: "news", task: m[1] };
    if ((m = /^cat-([a-z0-9-]+)$/.exec(tok)) && catOf[m[1]]) return { page: "news", cat: m[1] };
    return null;
  }
  function focusOn(el) { if (el) { try { el.focus({ preventScroll: true }); } catch (e) { /* focus is a convenience */ } } }
  // Each step in the browser's history keeps how far down its page was scrolled, so Back returns there.
  let shown = null;
  try { history.scrollRestoration = "manual"; } catch (e) { /* older browsers restore by themselves */ }
  function navigate(tok, push, quiet) {
    const r = parse(tok);
    if (!r) return false;
    const fromY = window.scrollY;
    route.page = r.page;
    route.item = r.item || null;
    if (r.page === "tech" && !r.item) {
      const g = r.group || "all";
      if (g !== ui.TF.group) { ui.TF.group = g; ui.TF.kind = "all"; ui.tlimit = TPAGE; }
    }
    if (r.company) ui.seg = "all";
    if (r.vtab) ui.vtab = r.vtab;
    if (r.tier) ui.tier = r.tier;
    if (r.task) { ui.F = blank(); ui.F.task = r.task; ui.limit = PAGE_N; }
    if (r.cat) { ui.F = blank(); ui.F.cat = r.cat; ui.limit = PAGE_N; }
    if (r.signal) {
      let list = filtered();
      if (!list.some((s) => s.id === r.signal)) { ui.F = blank(); list = filtered(); }
      const idx = list.findIndex((s) => s.id === r.signal);
      if (idx >= ui.limit) ui.limit = Math.ceil((idx + 1) / PAGE_N) * PAGE_N;
      ui.openSig[r.signal] = true;
    }
    closeMenu();
    hideTip();
    render();
    if (push) {
      const addr = r.signal ? "s-" + r.signal : r.item ? "t-" + r.item : r.company ? "c-" + r.company : r.group ? "tech-" + r.group : r.tier ? "box-" + r.tier : r.vtab || r.page;
      try { history.replaceState({ y: fromY }, "", location.href); history.pushState({ y: 0 }, "", "#" + addr); } catch (e) { try { location.hash = addr; } catch (e2) { /* the page works without the address */ } }
      shown = location.hash;
    }
    if (quiet) return true;
    if (r.signal || r.company) {
      const el = document.getElementById(r.signal ? "s-" + r.signal : "c-" + r.company);
      if (el) { el.scrollIntoView({ block: "start" }); focusOn(r.signal ? $("summary", el) : el); }
    } else {
      window.scrollTo(0, 0);
      focusOn(r.task || r.cat ? $("#count") : $("#h"));
    }
    return true;
  }

  // ---------- events ----------
  // A photo that will not load is removed rather than shown broken.
  document.addEventListener("error", (e) => {
    const im = e.target;
    if (im && im.tagName === "IMG") { const box = im.closest(".tc-img, .photo"); if (box) box.hidden = true; }
  }, true);
  document.addEventListener("click", (e) => {
    // On the self-updating site a video plays inside the page, in YouTube's privacy-enhanced player.
    const play = LIVE && e.target.closest("[data-play]");
    if (play) {
      e.preventDefault();
      const f = document.createElement("iframe");
      f.src = "https://www.youtube-nocookie.com/embed/" + encodeURIComponent(play.getAttribute("data-play")) + "?autoplay=1&rel=0";
      f.title = play.getAttribute("aria-label") || "YouTube";
      f.allow = "autoplay; encrypted-media; picture-in-picture";
      f.referrerPolicy = "strict-origin-when-cross-origin";
      f.allowFullscreen = true;
      const box = document.createElement("div");
      box.className = "vcover";
      box.appendChild(f);
      play.replaceWith(box);
      return;
    }
    // A social post loads from its own site, in that site's embed frame, only when asked.
    const emb = e.target.closest("[data-embed]");
    if (emb) {
      const p = (D.posts || []).filter((x) => x.id === emb.getAttribute("data-embed"))[0], box = p && document.getElementById("pe-" + p.id);
      if (p && p.embed && box) {
        const f = document.createElement("iframe");
        f.src = p.embed;
        f.title = p.platform + (p.author ? " " + p.author : "");
        f.loading = "lazy";
        f.referrerPolicy = "strict-origin-when-cross-origin";
        f.allow = "encrypted-media; picture-in-picture; clipboard-write";
        f.style.height = (POST_H[p.platform] || 520) + "px";
        box.appendChild(f);
        box.hidden = false;
        emb.hidden = true;
      }
      return;
    }
    // Fill a news item before it opens, so it never shows empty for a moment.
    const sum = e.target.closest("summary"), det = sum && sum.parentNode, sid = det && det.getAttribute("data-sig");
    if (sid) { const b = $(".sig-body", det); if (b && !b.firstChild) b.innerHTML = sigBody(byId[sid]); }
    const go = e.target.closest("[data-go]");
    if (go) { e.preventDefault(); navigate(go.getAttribute("data-go"), true); return; }
    const pick = e.target.closest("[data-pick]");
    if (pick) { e.preventDefault(); hideTip(); setPick(pick.getAttribute("data-pick")); return; }
    const one = (attr) => { const el = e.target.closest("[" + attr + "]"); return el ? el.getAttribute(attr) : null; };
    let v;
    if ((v = one("data-tier"))) { ui.tier = v; redraw(); return; }
    if ((v = one("data-tgroup"))) { navigate(v === "all" ? "tech" : "tech-" + v, true, true); focusOn($("#tg-" + v)); return; }
    if ((v = one("data-tview"))) { ui.tview = v; drawTech(); return; }
    if ((v = one("data-seg"))) { ui.seg = v; redraw(); return; }
    if ((v = one("data-vtab"))) { navigate(v, true, true); focusOn($("#vt-" + v)); return; }
    if ((v = one("data-rset"))) { ui.rset = v; ui.rquad = "all"; ui.pick = null; redraw(); return; }
    if ((v = one("data-rquad"))) { ui.rquad = v; redraw(); return; }
    if ((v = one("data-cat"))) { ui.F.cat = v; ui.limit = PAGE_N; drawFeed(); return; }
    const btn = e.target.closest("button"), id = btn && btn.id;
    if (id === "adv-btn") { ui.adv = !ui.adv; $("#adv").hidden = !ui.adv; $("#adv-btn").setAttribute("aria-expanded", String(ui.adv)); }
    else if (id === "clear") { ui.F = blank(); ui.limit = PAGE_N; redraw(); focusOn($("#count")); }
    else if (id === "tclear") { const g = ui.TF.group; ui.TF = tblank(); ui.TF.group = g; ui.tlimit = TPAGE; redraw(); focusOn($("#tcount")); }
    else if (id === "feed-more") { const before = ui.limit; ui.limit += PAGE_N; drawFeed(); focusOn($$("#feed .sig summary")[before]); }
    else if (id === "tmore") { const before = ui.tlimit; ui.tlimit += TPAGE; drawTech(); focusOn($$("#tlist .tcard")[before]); }
    else if (id === "lang-en" || id === "lang-ar") { const to = id.slice(5); if (to !== lang) { lang = to; store.set("er.lang", lang); redraw(); } }
    else if (id === "theme") { theme = theme === "auto" ? "light" : theme === "light" ? "dark" : "auto"; store.set("er.theme", theme); applyTheme(); $("#theme-text").textContent = t("theme_" + theme); $("#theme").title = t("theme_" + theme); }
    else if (id === "menu-btn") { const open = !$("#top").classList.contains("open"); $("#top").classList.toggle("open", open); $("#menu-btn").setAttribute("aria-expanded", String(open)); }
    else if (id === "more-btn") { const m = $("#more"), open = !m.classList.contains("open"); m.classList.toggle("open", open); btn.setAttribute("aria-expanded", String(open)); }
    else if (!e.target.closest("#more")) { const m = $("#more"); if (m && m.classList.contains("open")) { m.classList.remove("open"); $("#more-btn").setAttribute("aria-expanded", "false"); } }
  });
  document.addEventListener("change", (e) => {
    const map = { "f-rel": "rel", "f-ring": "ring", "f-task": "task", "f-sort": "sort" }, id = e.target.id;
    const tmap = { "tf-kind": "kind", "tf-verdict": "verdict", "tf-status": "status", "tf-sort": "sort" };
    if (map[id]) { ui.F[map[id]] = e.target.value; ui.limit = PAGE_N; drawFeed(); }
    else if (id === "f-new") { ui.F.onlyNew = e.target.checked; ui.limit = PAGE_N; drawFeed(); }
    else if (tmap[id]) { ui.TF[tmap[id]] = e.target.value; ui.tlimit = TPAGE; drawTech(); }
    else if (id === "tf-new") { ui.TF.onlyNew = e.target.checked; ui.tlimit = TPAGE; drawTech(); }
    else if (id === "tf-price") { ui.TF.priceOn = e.target.checked; $("#tf-max").disabled = !e.target.checked; ui.tlimit = TPAGE; drawTech(); }
  });
  let qTimer = 0;
  document.addEventListener("input", (e) => {
    const id = e.target.id, v = e.target.value;
    if (id !== "q" && id !== "tq" && id !== "gq" && id !== "tf-max") return;
    clearTimeout(qTimer);
    qTimer = setTimeout(() => {
      if (id === "q") { ui.F.q = v; ui.limit = PAGE_N; if ($("#feed")) drawFeed(); }
      else if (id === "tq") { ui.TF.q = v; ui.tlimit = TPAGE; drawTech(); }
      else if (id === "tf-max") { const n = parseFloat(v); if (n >= 0) { ui.TF.priceMax = n; ui.tlimit = TPAGE; drawTech(); } }
      else {
        ui.q = v;
        if (route.page !== "search" || route.item) navigate("search", true, true);
        else { const f = $("#found"); if (f) f.innerHTML = searchBody(); const d = $(".band .deck"); if (d) d.innerHTML = ui.q.trim() ? th("gs_for", { q: ui.q.trim() }) : ""; }
      }
    }, 160);
  });
  document.addEventListener("toggle", (e) => {
    const el = e.target;
    if (!el.getAttribute) return;
    const sig = el.getAttribute("data-sig");
    if (sig) {
      ui.openSig[sig] = el.open;
      const bodyEl = $(".sig-body", el);
      if (el.open && bodyEl && !bodyEl.firstChild) bodyEl.innerHTML = sigBody(byId[sig]);
      return;
    }
    if (el.getAttribute("data-ring")) ui.openRings[el.getAttribute("data-ring")] = el.open;
    else if (el.getAttribute("data-src")) ui.openSrc[el.getAttribute("data-src")] = el.open;
  }, true);
  const overBlip = (e) => e.target.closest && e.target.closest("#radar-svg .blip");
  document.addEventListener("mouseover", (e) => {
    const a = overBlip(e);
    if (a) { showTip(a); return; }
    const row = e.target.closest && e.target.closest("#rings button[data-id]");
    if (row) { const b = $('#radar-svg .blip[data-id="' + row.getAttribute("data-id") + '"]'); if (b) b.classList.add("hot"); }
  });
  document.addEventListener("mouseout", (e) => {
    if (overBlip(e)) hideTip();
    if (e.target.closest && e.target.closest("#rings button[data-id]")) $$("#radar-svg .blip.hot").forEach((b) => b.classList.remove("hot"));
  });
  document.addEventListener("focusin", (e) => { const a = overBlip(e); if (a) showTip(a); });
  document.addEventListener("focusout", (e) => { if (overBlip(e)) hideTip(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") { closeMenu(); hideTip(); } });
  const fromAddress = (e) => {
    if (e && e.type === "hashchange" && location.hash === shown) return;   // Back already drew this page
    const y = e && e.type === "popstate" && e.state && typeof e.state.y === "number" ? e.state.y : null;
    shown = location.hash;
    if (!navigate(location.hash, false, y !== null)) navigate("start", false);
    if (y !== null) requestAnimationFrame(() => window.scrollTo(0, y));
  };
  window.addEventListener("popstate", fromAddress);
  window.addEventListener("hashchange", fromAddress);
  window.addEventListener("resize", hideTip);

  // ---------- start ----------
  applyTheme();
  if (/staticrypt_pwd=/.test(location.hash)) { try { history.replaceState(null, "", location.pathname + location.search + (keyless(location.hash) ? "#" + keyless(location.hash) : "")); } catch (e) { /* the address keeps the key */ } }
  fromAddress();
  tryCovers();
})();

</script>

</body>
</html>
