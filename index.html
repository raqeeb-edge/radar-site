:root[data-theme="light"] { color-scheme: light; }
:root {
  --ui: "IBM Plex Sans", "IBM Plex Sans Arabic", system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
  --wrap: 78rem;
  --gut: clamp(1rem, 4vw, 2.5rem);
  --r: 4px;
}
html[lang="ar"] { --ui: "IBM Plex Sans Arabic", "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif; }
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 1rem/1.6 var(--ui); -webkit-font-smoothing: antialiased; }
html[lang="ar"] body { line-height: 1.85; }
h1, h2, h3, h4, p, ol, ul, dl, dd, figure { margin: 0; padding: 0; }
ol, ul { list-style: none; }
a { color: var(--accent-text); text-underline-offset: .2em; text-decoration-thickness: .06em; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
table { border-collapse: collapse; width: 100%; }
bdi { unicode-bidi: isolate; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--r); }
[tabindex="-1"]:focus { outline: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.skip { position: absolute; inset-inline-start: 1rem; top: -5rem; z-index: 60; padding: .6rem 1rem; border-radius: var(--r); background: var(--ink); color: var(--bg); }
.skip:focus { top: calc(env(safe-area-inset-top, 0px) + .5rem); }
.wrap { max-width: var(--wrap); margin-inline: auto; padding-inline: var(--gut); }

/* ---------- top bar ---------- */
/* Two rows on a wide screen: the name and the tools, then the sections. When the page scrolls, the
   first row slides away and the row of sections stays. */
.top { position: sticky; top: calc(env(safe-area-inset-top, 0px) - 3.75rem); z-index: 30; background: var(--bg); border-bottom: 1px solid var(--rule); }
.top-row { display: flex; align-items: center; gap: .5rem 1rem; height: 3.75rem; }
.brand { display: inline-flex; align-items: center; gap: .6rem; flex: none; text-decoration: none; color: var(--ink); font-weight: 700; font-size: 1.0625rem; letter-spacing: -.01em; white-space: nowrap; }
html[lang="ar"] .brand { letter-spacing: 0; }
.brand svg { width: 1.75rem; height: 1.75rem; flex: none; }
.brand .bm-a { fill: var(--accent); } .brand .bm-b { fill: none; stroke: var(--accent); stroke-width: 2; } .brand .bm-c { fill: var(--bg); }
.nav-row { border-top: 1px solid var(--rule-2); }
.nav-main { display: flex; align-items: stretch; gap: .15rem; margin-inline: -.7rem; }
.nav-main a, .more-btn { display: flex; align-items: center; height: 2.75rem; padding: 0 .7rem; border: 0; background: none; font-size: .9375rem; font-weight: 500; line-height: 1.3; text-decoration: none; color: var(--ink-2); white-space: nowrap; }
.nav-main a:hover, .more-btn:hover { color: var(--ink); box-shadow: inset 0 -2px 0 var(--control); }
.nav-main a[aria-current="page"] { color: var(--ink); font-weight: 600; box-shadow: inset 0 -2px 0 var(--accent); }
.more { position: relative; }
.more-btn { gap: .4rem; }
.more-btn::after { content: ""; width: .4rem; height: .4rem; margin-top: -.2rem; border-inline-end: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: rotate(45deg); }
.more-list { display: none; position: absolute; top: calc(100% + .1rem); inset-inline-start: 0; z-index: 5; min-width: 13rem; padding: .35rem; border: 1px solid var(--rule); border-radius: var(--r); background: var(--panel); box-shadow: 0 14px 28px var(--shade); }
.more.open .more-list { display: block; }
.more-list a { height: auto; padding: .5rem .65rem; border-radius: var(--r); }
.more-list a:hover { background: var(--band); box-shadow: none; }
.more-list a[aria-current="page"] { box-shadow: inset 2px 0 0 var(--accent); }
[dir="rtl"] .more-list a[aria-current="page"] { box-shadow: inset -2px 0 0 var(--accent); }
.top-tools { display: flex; align-items: center; gap: .5rem; flex: none; margin-inline-start: auto; }
.gsearch input { width: 15rem; min-height: 2.35rem; padding: .35rem .7rem; border: 1px solid var(--control); border-radius: var(--r); background: var(--panel); font-size: .9375rem; }
.lang { display: flex; flex: none; border: 1px solid var(--control); border-radius: var(--r); overflow: hidden; }
.lang button { min-height: 2.35rem; padding: .3rem .6rem; border: 0; background: transparent; font-size: .875rem; font-weight: 500; }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.tool { display: inline-grid; place-items: center; flex: none; width: 2.35rem; height: 2.35rem; border: 1px solid var(--control); border-radius: var(--r); background: transparent; color: var(--ink-2); }
.tool:hover, .lang button:hover { color: var(--ink); border-color: var(--ink-2); }
.tool svg { width: 1.1rem; height: 1.1rem; fill: currentColor; }
.menu-btn { display: none; flex: none; min-height: 2.35rem; padding: .3rem .8rem; border: 1px solid var(--control); border-radius: var(--r); background: var(--panel); font-size: .9375rem; font-weight: 500; }

/* ---------- page band, type, shared pieces ---------- */
.band { background: var(--band); border-bottom: 1px solid var(--rule-2); }
.band > .wrap { display: grid; gap: .9rem; padding-block: clamp(1.6rem, 4vw, 2.75rem); }
.body { display: grid; gap: clamp(2rem, 4.5vw, 3.25rem); padding-block: clamp(1.6rem, 4vw, 2.75rem) 3.5rem; }
.body > * { min-width: 0; }
h1 { font: 600 clamp(1.85rem, 3.6vw, 2.75rem)/1.12 var(--ui); letter-spacing: -.02em; text-wrap: balance; max-width: 46rem; }
h2 { font: 600 1.5rem/1.25 var(--ui); letter-spacing: -.012em; text-wrap: balance; }
h3 { font: 600 1.0625rem/1.4 var(--ui); }
html[lang="ar"] h1 { line-height: 1.4; letter-spacing: 0; }
html[lang="ar"] h2 { line-height: 1.55; letter-spacing: 0; }
.deck { max-width: 46rem; font-size: clamp(1.0625rem, 1.6vw, 1.1875rem); line-height: 1.55; color: var(--ink-2); }
.sec { display: grid; gap: 1.1rem; }
.sec > * { min-width: 0; }
.sec-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: .3rem 1.5rem; }
.sub { max-width: 46rem; margin-top: -.6rem; color: var(--ink-2); }
.note { font-size: .875rem; line-height: 1.6; color: var(--muted); max-width: 48rem; }
.crumb { display: flex; flex-wrap: wrap; align-items: center; gap: .3rem .55rem; font-size: .9375rem; color: var(--muted); }
.crumb a { color: var(--ink-2); }
.crumb i { width: .35rem; height: .35rem; border-inline-end: 1.5px solid var(--muted); border-top: 1.5px solid var(--muted); transform: rotate(45deg); }
[dir="rtl"] .crumb i { transform: rotate(-135deg); }
.more-link { font-weight: 500; white-space: nowrap; }
.btn { display: inline-block; line-height: 1.5rem; padding: .45rem .95rem; border: 1px solid var(--control); border-radius: var(--r); background: var(--panel); color: var(--ink); font-size: .9375rem; font-weight: 500; text-decoration: none; white-space: nowrap; }
.btn:hover { border-color: var(--accent); color: var(--accent-text); }
.btn.go { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.go:hover { color: var(--accent-ink); filter: brightness(1.08); }
.linkbtn { border: 0; background: none; padding: .3rem 0; color: var(--accent-text); text-decoration: underline; text-underline-offset: .2em; font-size: .9375rem; }
.pips { display: inline-flex; gap: 2px; flex: none; }
.pips i { width: 5px; height: 13px; border-radius: 1px; background: var(--rule); }
.pips i.on { background: var(--accent); }
.vs { display: inline-grid; grid-template-columns: 7px 7px; gap: 2px; flex: none; }
.vs::before, .vs::after { content: ""; height: 13px; border: 1.5px solid var(--ink-2); border-radius: 1px; }
.stance { display: inline-flex; align-items: center; gap: .45rem; font-size: .875rem; font-weight: 500; color: var(--ink-2); white-space: nowrap; }
.price { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.noprice { font-size: .875rem; color: var(--muted); }
.num { display: inline-grid; place-items: center; min-width: 1.85rem; height: 1.85rem; padding-inline: .3rem; border-radius: 999px; font: 600 .8125rem/1 var(--ui); font-variant-numeric: tabular-nums; text-decoration: none; flex: none; }
.num.high { background: var(--rel-1); color: var(--on-rel-1); }
.num.medium { background: var(--rel-2); color: var(--on-rel-2); }
.num.low { background: var(--rel-3); color: var(--on-rel-3); }
.num.tech { background: var(--tech); color: var(--on-tech); }
.num.v-adopt { background: var(--v-adopt); color: var(--on-v-adopt); } .num.v-trial { background: var(--v-trial); color: var(--on-v-trial); }
.num.v-assess { background: var(--v-assess); color: var(--on-v-assess); } .num.v-hold { background: var(--v-hold); color: var(--on-v-hold); }
.num.isnew { box-shadow: 0 0 0 2px var(--bg), 0 0 0 3.5px var(--accent); }
.pill { display: inline-block; padding: .08rem .5rem; border-radius: 999px; background: var(--accent-soft); color: var(--accent-text); font-size: .75rem; font-weight: 600; white-space: nowrap; }
.tg { display: inline-block; padding: .12rem .55rem; border: 1px solid var(--rule); border-radius: var(--r); background: var(--panel); font-size: .8125rem; line-height: 1.5; color: var(--ink-2); white-space: nowrap; }
.tagrow { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem; }
.seg { display: flex; flex-wrap: wrap; gap: .4rem; }
.seg button { min-height: 2.5rem; padding: .4rem .85rem; border: 1px solid var(--control); border-radius: var(--r); background: var(--panel); color: var(--ink); font-size: .9375rem; line-height: 1.3; }
.seg button:hover { border-color: var(--accent); }
.seg button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); font-weight: 600; }
.seg .n { margin-inline-start: .4rem; font-size: .8125rem; font-weight: 400; opacity: .8; font-variant-numeric: tabular-nums; }
/* position: relative keeps the hidden screen-reader text of links inside the scrolling box */
.tbl-wrap { position: relative; overflow-x: auto; border: 1px solid var(--rule); border-radius: var(--r); background: var(--panel); }
.tbl { min-width: 44rem; font-size: .9375rem; }
.tbl th, .tbl td { padding: .75rem .9rem; text-align: start; vertical-align: top; border-bottom: 1px solid var(--rule-2); }
.tbl thead th { font-size: .8125rem; font-weight: 600; color: var(--muted); white-space: nowrap; background: var(--band); border-bottom-color: var(--rule); }
.tbl tbody tr:last-child > * { border-bottom: 0; }
.tbl tbody th { font-weight: 600; min-width: 12rem; }
.tbl small { display: block; font-size: .8125rem; font-weight: 400; color: var(--muted); line-height: 1.5; }
.tbl .nowrap { white-space: nowrap; }
.lanes { min-width: 34rem; }
.fx { display: block; }
.refs { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem; font-size: .8125rem; color: var(--muted); }
.pn { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; padding-top: 1.5rem; border-top: 1px solid var(--rule); }
.pn a { display: grid; gap: .1rem; padding: .25rem 0; text-decoration: none; }
.pn a span { font-size: .8125rem; color: var(--muted); }
.pn a b { font: 600 1.125rem/1.35 var(--ui); color: var(--ink); }
.pn a:hover b { color: var(--accent-text); }
.pn .next { text-align: end; }
.plate { background-color: var(--plate); background-image: radial-gradient(circle, var(--dot) 1px, transparent 1.3px); background-size: 14px 14px; border-radius: var(--r); padding: clamp(.4rem, 1.4vw, .9rem); }
.cap { font-size: .8125rem; line-height: 1.6; color: var(--muted); }
.cap b { color: var(--ink); font-weight: 600; }
.key { counter-reset: k; display: grid; gap: .65rem; font-size: .9375rem; line-height: 1.55; color: var(--ink-2); }
.key li { counter-increment: k; display: grid; grid-template-columns: 1.6rem minmax(0, 1fr); gap: .7rem; align-items: start; }
.key li::before { content: counter(k); display: grid; place-items: center; width: 1.6rem; height: 1.6rem; border-radius: 50%; background: var(--ink); color: var(--bg); font: 600 .78rem/1 var(--ui); }
.key b { color: var(--ink); font-weight: 600; }

/* related technology: name, verdict, price and the reference for that price */
.rel { border: 1px solid var(--rule); border-radius: var(--r); background: var(--panel); }
.rel li { display: grid; grid-template-columns: minmax(0, 1.5fr) 7.5rem 8rem minmax(0, 1.1fr); gap: .3rem 1.1rem; align-items: center; padding: .75rem .95rem; border-bottom: 1px solid var(--rule-2); }
.rel li:last-child { border-bottom: 0; }
.rel-name a { font-weight: 600; text-decoration: none; }
.rel-name a:hover { text-decoration: underline; }
.rel-name span { display: block; font-size: .875rem; line-height: 1.45; color: var(--ink-2); }
.rel-ref { font-size: .8125rem; line-height: 1.5; color: var(--muted); }
.rel-ref .lab { font-weight: 600; }
.rel-h { font: 600 .9375rem/1.4 var(--ui); margin-bottom: .6rem; }

/* ---------- home ---------- */
.meta { font-size: .875rem; line-height: 1.6; color: var(--muted); }
.fresh { color: var(--ink-2); font-weight: 500; }
.fresh i { display: inline-block; width: .55rem; height: .55rem; margin-inline-end: .45rem; border-radius: 50%; background: var(--good); }
.fresh.stale i { background: var(--warn); }
.counts { display: flex; flex-wrap: wrap; gap: .5rem 2.25rem; padding-top: .35rem; }
.counts div { display: flex; align-items: baseline; gap: .45rem; }
.counts dd { font: 600 1.5rem/1.1 var(--ui); font-variant-numeric: tabular-nums; }
.counts dt { order: 2; font-size: .9375rem; color: var(--ink-2); }
.stories { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 0 clamp(1.5rem, 4vw, 3rem); }
.story { display: grid; gap: .5rem; align-content: start; padding: 1.15rem 0; border-top: 1px solid var(--rule); }
.story h3 { font-size: 1.125rem; line-height: 1.35; }
.story h3 a { color: var(--ink); text-decoration: none; }
.story h3 a:hover { color: var(--accent-text); text-decoration: underline; }
.story p { color: var(--ink-2); }
.stories > div { display: grid; align-content: start; min-width: 0; }
.story.lead { padding-top: 1.35rem; border-top: 3px solid var(--ink); }
.story.lead h3 { font-size: clamp(1.5rem, 2.6vw, 2rem); line-height: 1.18; letter-spacing: -.015em; }
html[lang="ar"] .story.lead h3 { line-height: 1.45; letter-spacing: 0; }
.story.lead p { font-size: 1.0625rem; color: var(--ink); }
.story.lead .btn { justify-self: start; margin-top: .4rem; }
.side-stories .story:first-child { border-top: 3px solid var(--ink); }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr)); gap: 1rem; }
.maprow { display: grid; gap: .7rem; }
.tiles.c2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.tiles.c3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.tiles.c4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.tiles.c5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.maprow + .maprow { margin-top: .5rem; }
.maprow h3 { font-size: 1rem; color: var(--ink-2); }
.tile { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: .3rem 1rem; align-content: start; height: 100%; padding: 1.1rem 1.15rem; border: 1px solid transparent; border-radius: var(--r); background: var(--band); text-decoration: none; color: var(--ink); }
.tile:hover { border-color: var(--accent); }
.tile .tn { font-weight: 600; font-size: 1.0625rem; line-height: 1.35; }
.tile .tc { font: 600 1.25rem/1.2 var(--ui); font-variant-numeric: tabular-nums; color: var(--accent-text); }
.tile .td { grid-column: 1 / -1; font-size: .875rem; line-height: 1.5; color: var(--ink-2); }
.rows { border-top: 1px solid var(--rule); }
.rows li { border-bottom: 1px solid var(--rule-2); }
.row { display: grid; grid-template-columns: 6.5rem minmax(0, 1fr) auto; gap: .2rem 1.25rem; align-items: baseline; padding: .7rem 0; text-decoration: none; color: var(--ink); }
.row .rd { font-size: .875rem; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.row .rn b { font-weight: 600; }
.row:hover .rn b { color: var(--accent-text); text-decoration: underline; }
.row .rn small { display: block; font-size: .875rem; line-height: 1.45; color: var(--ink-2); }
.row .rv { align-self: center; }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2rem clamp(1.5rem, 4vw, 3rem); align-items: start; }

/* ---------- technology finder ---------- */
.finder { display: grid; grid-template-columns: 15.5rem minmax(0, 1fr); gap: clamp(1.25rem, 3vw, 2.5rem); align-items: start; }
.rail { display: grid; gap: .9rem; padding: 1.1rem; border-radius: var(--r); background: var(--band); }
.rail h2 { font-size: 1rem; }
.field { display: grid; gap: .3rem; font-size: .875rem; font-weight: 600; color: var(--ink-2); }
.field input, .field select, .search input { width: 100%; min-height: 2.5rem; padding: .4rem .7rem; border: 1px solid var(--control); border-radius: var(--r); background: var(--panel); font-weight: 400; color: var(--ink); }
.check { display: flex; align-items: center; gap: .55rem; min-height: 2.25rem; font-size: .9375rem; font-weight: 400; color: var(--ink); }
.check input { width: 1.1rem; height: 1.1rem; flex: none; accent-color: var(--accent); }
.pricebox { display: grid; gap: .4rem; padding-top: .8rem; border-top: 1px solid var(--rule); }
.pricebox .money { display: flex; align-items: center; gap: .4rem; }
.pricebox input[type="number"] { width: 7rem; min-height: 2.25rem; padding: .3rem .6rem; border: 1px solid var(--control); border-radius: var(--r); background: var(--panel); }
.pricebox .hint { font-size: .8125rem; line-height: 1.5; color: var(--muted); }
.results { display: grid; gap: 1rem; min-width: 0; }
.count-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .5rem 1rem; }
.count { font-size: .9375rem; color: var(--ink-2); }
.tgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(16.5rem, 1fr)); gap: 1rem; }
.tcard { display: grid; grid-template-rows: auto auto auto 1fr auto auto; gap: .4rem; height: 100%; padding: 1.05rem 1.1rem 1rem; border: 1px solid var(--rule); border-radius: var(--r); background: var(--panel); text-decoration: none; color: var(--ink); }
.tcard:hover { border-color: var(--accent); box-shadow: 0 6px 18px var(--shade); }
.tc-top { display: flex; align-items: center; justify-content: space-between; gap: .5rem; font-size: .8125rem; color: var(--muted); }
.tc-name { font: 600 1.1875rem/1.28 var(--ui); letter-spacing: -.008em; }
html[lang="ar"] .tc-name { line-height: 1.5; letter-spacing: 0; }
.tcard:hover .tc-name { color: var(--accent-text); }
.tc-kind { font-size: .8125rem; color: var(--muted); }
.tc-what { font-size: .9375rem; line-height: 1.5; color: var(--ink-2); }
.tc-specs { display: grid; gap: .1rem; padding: .55rem 0; border-block: 1px solid var(--rule-2); font-size: .8125rem; line-height: 1.5; }
.tc-specs .sp { display: grid; grid-template-columns: 6.2rem minmax(0, 1fr); gap: .6rem; }
.tc-specs .sp > span { color: var(--muted); }
.tc-specs .sp > b { font-weight: 500; color: var(--ink); }
.tc-foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .3rem .6rem; font-size: .9375rem; }
.empty { padding: 2rem 0; color: var(--ink-2); }
.empty strong { display: block; color: var(--ink); }
.showmore { justify-self: start; }

/* ---------- one technology ---------- */
.item-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 1.25rem clamp(1.5rem, 4vw, 3rem); align-items: end; }
.item-head .mk { font-size: .9375rem; color: var(--ink-2); }
.rolerow { display: flex; flex-wrap: wrap; align-items: baseline; gap: .15rem .6rem; font-size: .9375rem; }
.rolerow > span:first-child { color: var(--muted); }
.rolerow b { font-weight: 500; color: var(--ink); }
.vbox { display: grid; gap: .3rem; min-width: 13rem; padding: .95rem 1.1rem; border-radius: var(--r); background: var(--panel); border: 1px solid var(--rule); }
.vbox .lab { font-size: .8125rem; color: var(--muted); }
.vbox .v { display: flex; align-items: center; gap: .6rem; font: 600 1.375rem/1.2 var(--ui); }
.vbox .pips i { width: 7px; height: 18px; }
.vbox .vs { grid-template-columns: 9px 9px; } .vbox .vs::before, .vbox .vs::after { height: 18px; }
.vbox .pr { margin-top: .25rem; padding-top: .55rem; border-top: 1px solid var(--rule-2); font-size: .9375rem; }
.answers { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 clamp(1.5rem, 4vw, 3rem); }
.ans { display: grid; gap: .5rem; align-content: start; padding: 1.2rem 0 1.35rem; border-top: 1px solid var(--rule); }
.ans h2 { font-size: 1.0625rem; letter-spacing: 0; color: var(--muted); font-weight: 600; }
.ans p { font-size: 1.0625rem; max-width: 40rem; }
.ans ul { display: grid; gap: .45rem; }
.ans li { position: relative; padding-inline-start: 1.15rem; font-size: 1.0625rem; }
.ans li::before { content: ""; position: absolute; inset-inline-start: 0; top: .62em; width: .45rem; height: .45rem; border-radius: 1px; background: var(--accent); }
html[lang="ar"] .ans li::before { top: .8em; }
.ans.use { grid-column: 1 / -1; padding: 1.2rem 1.25rem 1.3rem; border: 0; border-radius: var(--r); background: var(--accent-soft); }
.ans.use h2 { color: var(--accent-text); }
.ans.use .v { display: flex; align-items: center; gap: .55rem; font: 600 1.25rem/1.25 var(--ui); }
.ans.use p { max-width: 52rem; }
.spec th { width: 34%; padding: .6rem 1rem .6rem 0; text-align: start; vertical-align: top; font-weight: 500; color: var(--ink-2); border-bottom: 1px solid var(--rule-2); }
.spec td { padding: .6rem 0; border-bottom: 1px solid var(--rule-2); }
.spec td small { display: block; font-size: .8125rem; line-height: 1.55; color: var(--muted); }
[dir="rtl"] .spec th { padding: .6rem 0 .6rem 1rem; }
.reflist { display: grid; gap: .45rem; font-size: .9375rem; }
.reflist li { display: flex; flex-wrap: wrap; gap: .1rem .6rem; align-items: baseline; }
.reflist span { font-size: .8125rem; color: var(--muted); }
.photo-note { display: flex; flex-wrap: wrap; align-items: center; gap: .6rem 1rem; padding: .9rem 1.1rem; border: 1px dashed var(--control); border-radius: var(--r); font-size: .9375rem; color: var(--ink-2); }
.siglinks { border-top: 1px solid var(--rule); }
.siglinks li { border-bottom: 1px solid var(--rule-2); }
.siglinks a { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: .8rem; align-items: center; padding: .65rem 0; text-decoration: none; color: var(--ink); }
.siglinks a:hover span:last-child { color: var(--accent-text); text-decoration: underline; }
.chips { display: flex; flex-wrap: wrap; gap: .4rem; }
.chip { display: inline-block; line-height: 1.4rem; padding: .25rem .7rem; border: 1px solid var(--rule); border-radius: 999px; background: var(--panel); font-size: .875rem; color: var(--ink-2); text-decoration: none; }
.chip:hover { border-color: var(--accent); color: var(--accent-text); }
button.chip { font-size: .8125rem; }

/* ---------- the idea ---------- */
.prose p { max-width: 46rem; font-size: 1.0625rem; }
.musts { display: grid; gap: .55rem; max-width: 46rem; }
.musts li { position: relative; padding-inline-start: 1.4rem; font-size: 1.0625rem; }
.musts li::before { content: ""; position: absolute; inset-inline-start: .1rem; top: .62em; width: .45rem; height: .45rem; border-radius: 1px; background: var(--accent); }
html[lang="ar"] .musts li::before { top: .8em; }
.tiercards { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .75rem; }
.tierc { display: block; padding: .9rem 1rem 1rem; border: 1px solid var(--control); border-radius: var(--r); background: var(--panel); color: var(--ink); text-align: start; }
a.tierc { text-decoration: none; }
.tierc > span { display: block; }
.tierc .tk { font-size: .8125rem; font-weight: 600; color: var(--muted); }
.tierc .tm { margin-bottom: .35rem; font: 600 1.1875rem/1.3 var(--ui); }
html[lang="ar"] .tierc .tm { line-height: 1.55; }
.tierc .tx { font-size: .9375rem; line-height: 1.5; color: var(--ink-2); }
.tierc .to { margin-top: .55rem; padding-top: .5rem; border-top: 1px solid var(--rule-2); font-size: .875rem; line-height: 1.5; color: var(--ink-2); }
.tierc .to b { font-weight: 600; color: var(--ink); }
.tierc:hover { border-color: var(--accent); }
.tierc[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 3px 0 var(--accent); }
.tierc[aria-pressed="true"] .tk { color: var(--accent-text); }
.tier-fig { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: clamp(1.25rem, 3vw, 2.25rem); align-items: center; }
.tier-side { display: grid; gap: 1.35rem; justify-items: start; }
.tier-side > * { min-width: 0; }
.tier-fig .cap { margin-top: .9rem; }
.lanes th[scope="row"] { white-space: nowrap; }
.lanes tr.on > * { background: var(--accent-soft); }
.lanes .lane-name { display: block; font-weight: 400; color: var(--ink-2); font-size: .875rem; }
.total { max-width: 48rem; font-size: 1.0625rem; }

/* ---------- news ---------- */
.filters { display: grid; gap: .9rem; }
.filter-row { display: flex; flex-wrap: wrap; gap: .6rem; align-items: center; }
.search { flex: 1 1 16rem; }
.adv { display: grid; grid-template-columns: repeat(auto-fit, minmax(12rem, 1fr)); gap: .9rem 1rem; align-items: end; padding: 1rem; border-radius: var(--r); background: var(--band); }
.sigs { border-top: 1px solid var(--rule); }
.sig { border-bottom: 1px solid var(--rule); scroll-margin-top: 5rem; }
.sig summary { display: grid; grid-template-columns: auto minmax(0, 1fr) auto 1rem; gap: .25rem 1rem; align-items: start; padding: 1rem 0; cursor: pointer; list-style: none; }
.sig summary::-webkit-details-marker { display: none; }
.sig summary::after { content: ""; grid-column: 4; grid-row: 1; width: .5rem; height: .5rem; margin-top: .5rem; border-inline-end: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); }
.sig details[open] summary::after { transform: rotate(-135deg); margin-top: .75rem; }
.sig summary:hover .sig-title { color: var(--accent-text); }
.sig-title { display: block; font: 600 1.0625rem/1.45 var(--ui); }
.sig-next { display: block; margin-top: .15rem; font-size: .9375rem; line-height: 1.55; color: var(--ink-2); }
.sig-next b { font-weight: 600; color: var(--ink); }
.sig-meta { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: .2rem .7rem; max-width: 22rem; padding-top: .2rem; font-size: .8125rem; color: var(--muted); text-align: end; }
.sig-body { display: grid; gap: 1.1rem; padding: 0 0 1.4rem; padding-inline-start: 2.85rem; }
.sig-body .why { max-width: 48rem; font-size: 1.0625rem; }
.calls { display: grid; grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr)); gap: .9rem 1.5rem; }
.calls dt, .lab2 { font-size: .8125rem; font-weight: 600; color: var(--muted); margin-bottom: .2rem; }
.calls dd { font-size: .9375rem; line-height: 1.6; }
.calls dd .pips { margin-inline-end: .45rem; vertical-align: -1px; }
.srcs { font-size: .875rem; line-height: 1.65; color: var(--ink-2); }
.banner { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem 1rem; padding: .7rem 1rem; border-radius: var(--r); background: var(--accent-soft); font-size: .9375rem; }

/* ---------- radar ---------- */
.radar-wrap { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: clamp(1.25rem, 3vw, 2.25rem); align-items: start; }
.radar-ctl { display: flex; flex-wrap: wrap; gap: .75rem 1.5rem; align-items: center; }
#radar-fig { position: relative; display: grid; gap: .8rem; }
#radar-host { position: relative; border-radius: var(--r); background: var(--band); padding: .5rem; }
#radar-svg { display: block; width: 100%; height: auto; max-width: 44rem; margin-inline: auto; overflow: visible; }
#radar-svg .band-c { fill: var(--panel); stroke: var(--rule); stroke-width: 1; }
#radar-svg .band-c.b-trial { fill: var(--band-trial); } #radar-svg .band-c.b-assess { fill: var(--band-assess); } #radar-svg .band-c.b-hold { fill: var(--band-hold); }
#radar-svg .ringlab.r-trial { stroke: var(--band-trial); } #radar-svg .ringlab.r-assess { stroke: var(--band-assess); } #radar-svg .ringlab.r-hold { stroke: var(--band-hold); }
#radar-svg .core { fill: var(--accent-soft); stroke: var(--rule); stroke-width: 1; }
#radar-svg .axis { stroke: var(--rule); stroke-width: 1; }
#radar-svg .ringlab { fill: var(--ink-2); font: 500 15px var(--ui); paint-order: stroke; stroke: var(--panel); stroke-width: 7px; stroke-linejoin: round; }
#radar-svg .ringlab.c { stroke: var(--accent-soft); }
#radar-svg .quadlab { fill: var(--ink); font: 600 16px var(--ui); }
#radar-svg .quadlab .cnt { fill: var(--muted); font-weight: 400; }
#radar-svg .blip { cursor: pointer; }
#radar-svg .blip.dim { opacity: .16; }
#radar-svg .blip .dot { stroke: var(--panel); stroke-width: 2; }
#radar-svg .blip .hit { fill: transparent; }
#radar-svg .blip text { font: 600 13px var(--ui); pointer-events: none; font-variant-numeric: tabular-nums; }
#radar-svg .blip.small text { font-size: 11px; }
#radar-svg .blip.small.d3 text { font-size: 9.5px; }
#radar-svg .blip.high .dot { fill: var(--rel-1); } #radar-svg .blip.high text { fill: var(--on-rel-1); }
#radar-svg .blip.medium .dot { fill: var(--rel-2); } #radar-svg .blip.medium text { fill: var(--on-rel-2); }
#radar-svg .blip.low .dot { fill: var(--rel-3); } #radar-svg .blip.low text { fill: var(--on-rel-3); }
#radar-svg .blip.tech .dot { fill: var(--tech); } #radar-svg .blip.tech text { fill: var(--on-tech); }
#radar-svg .blip.v-adopt .dot { fill: var(--v-adopt); } #radar-svg .blip.v-adopt text { fill: var(--on-v-adopt); }
#radar-svg .blip.v-trial .dot { fill: var(--v-trial); } #radar-svg .blip.v-trial text { fill: var(--on-v-trial); }
#radar-svg .blip.v-assess .dot { fill: var(--v-assess); } #radar-svg .blip.v-assess text { fill: var(--on-v-assess); }
#radar-svg .blip.v-hold .dot { fill: var(--v-hold); } #radar-svg .blip.v-hold text { fill: var(--on-v-hold); }
#radar-svg .blip .halo { fill: none; stroke: var(--accent); stroke-width: 1.75; }
#radar-svg .blip:hover .dot, #radar-svg .blip.hot .dot, #radar-svg .blip.sel .dot, #radar-svg .blip:focus-visible .dot { stroke: var(--ink); stroke-width: 2.5; }
#radar-svg .blip:focus-visible { outline: none; }
#radar-svg .blip:focus-visible .hit { stroke: var(--accent); stroke-width: 2; }
.swipe { display: none; font-size: .8125rem; color: var(--muted); }
.legend { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem 1.2rem; font-size: .875rem; color: var(--ink-2); }
.legend li { display: inline-flex; align-items: center; gap: .45rem; }
.sw { width: .8rem; height: .8rem; border-radius: 50%; flex: none; }
.sw.high { background: var(--rel-1); } .sw.medium { background: var(--rel-2); } .sw.low { background: var(--rel-3); } .sw.tech { background: var(--tech); }
.sw.v-adopt { background: var(--v-adopt); } .sw.v-trial { background: var(--v-trial); } .sw.v-assess { background: var(--v-assess); } .sw.v-hold { background: var(--v-hold); }
.sw.new { background: none; border: 1.75px solid var(--accent); }
#tip { position: absolute; z-index: 5; max-width: 16rem; padding: .5rem .7rem; border-radius: var(--r); background: var(--ink); color: var(--bg); font-size: .8125rem; line-height: 1.45; pointer-events: none; }
#tip b { display: block; font-weight: 600; }
.radar-side { display: grid; gap: 1.5rem; }
.pick { display: grid; gap: .7rem; padding: 1.1rem; border: 1px solid var(--rule); border-radius: var(--r); background: var(--panel); }
.pick.none { color: var(--ink-2); font-size: .9375rem; }
.pick-top { display: flex; gap: .7rem; align-items: start; }
.pick h3 { font-size: 1.0625rem; }
.pick p { font-size: .9375rem; color: var(--ink-2); }
.pick .btn { justify-self: start; }
.rings h3 { margin-bottom: .5rem; }
.rings details { border-top: 1px solid var(--rule); }
.rings details:last-child { border-bottom: 1px solid var(--rule); }
.rings summary { display: grid; grid-template-columns: auto auto minmax(0, 1fr) auto; gap: .55rem; align-items: center; padding: .7rem 0; cursor: pointer; font-weight: 600; }
.rings summary .d { font-size: .8125rem; font-weight: 400; color: var(--muted); }
.rings summary .c { font-size: .875rem; font-weight: 400; color: var(--muted); font-variant-numeric: tabular-nums; }
.rings ol { display: grid; gap: .1rem; padding-bottom: .7rem; }
.rings ol button { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: .6rem; align-items: center; width: 100%; padding: .3rem .25rem; border: 0; border-radius: var(--r); background: none; font-size: .9375rem; line-height: 1.45; text-align: start; }
.rings ol button:hover, .rings ol button.hot { background: var(--band); }

/* ---------- companies ---------- */

b view come from, and how can it be cut?","descAr":"من أين يأتي التأخير بين الكاميرا وصفحة العرض، وكيف يمكن تقليصه؟"},{"id":"connect","en":"Outbound connection","ar":"الاتصال الصادر","descEn":"The tunnel to the cloud, how camera credentials are stored, and who holds the data.","descAr":"النفق إلى السحابة، وطريقة حفظ بيانات دخول الكاميرات، ومن يحتفظ بالبيانات."},{"id":"zero","en":"Zero-connection sites","ar":"المواقع المعزولة","descEn":"The offline variant for restricted sites: its hardware, its price, and support without a link.","descAr":"النسخة غير المتصلة للمواقع المقيّدة: عتادها وسعرها ودعمها دون اتصال."},{"id":"fleet","en":"Fleet operations","ar":"إدارة الأجهزة","descEn":"Updates, health checks and support across hundreds of boxes. No fleet-wide dashboard is planned yet.","descAr":"التحديثات وفحص السلامة والدعم لمئات الأجهزة. لا توجد لوحة موحّدة لكل المواقع حتى الآن."},{"id":"rules","en":"Saudi rules","ar":"الأنظمة السعودية","descEn":"Recording retention per site type, transferring footage, and personal-data obligations.","descAr":"مدة حفظ التسجيلات حسب نوع الموقع، ونقل المقاطع، والتزامات حماية البيانات الشخصية."},{"id":"supply","en":"Supply into Saudi Arabia","ar":"التوريد إلى السعودية","descEn":"Who supplies the hardware, and can it be imported and supported locally?","descAr":"من يورّد العتاد، وهل يمكن استيراده ودعمه محليًّا؟"},{"id":"nohw","en":"Paths with no box","ar":"مسارات بلا جهاز","descEn":"Could cameras or recorders do this job without Raqeeb hardware?","descAr":"هل تستطيع الكاميرات أو المسجّلات أداء المهمة دون عتاد من رقيب؟"}],"srcTypes":[{"id":"news","en":"News and trade press","ar":"الأخبار والصحافة المتخصّصة"},{"id":"vendor","en":"Vendor pages and price lists","ar":"صفحات المورّدين وقوائم الأسعار"},{"id":"docs","en":"Technical documentation and release notes","ar":"الوثائق التقنية وملاحظات الإصدارات"},{"id":"paper","en":"Research papers","ar":"الأوراق البحثية"},{"id":"law","en":"Legal and regulatory summaries","ar":"ملخّصات قانونية وتنظيمية"},{"id":"ref","en":"Reference and price trackers","ar":"مراجع ومتتبّعات أسعار"}],"brief":[{"refs":["hailo-microchip","deepx-production","memryx-frigate"],"to":"s-hailo-microchip","head":{"en":"The main card maker has a new owner","ar":"صانع البطاقة الرئيسي له مالك جديد"},"en":"Microchip completed its purchase of Hailo on 21 September, three months after Hailo cut half its staff. Microchip says it will keep supporting the products, with no explicit supply commitment. DEEPX is in volume production from $85 a card, and Frigate now measures MemryX and Axera chips too, so real second sources exist.","ar":"أتمّت Microchip شراء Hailo في 21 سبتمبر، بعد ثلاثة أشهر من تسريح Hailo نصف موظفيها. تقول Microchip إنها ستواصل دعم المنتجات، دون التزام صريح بالتوريد. وDEEPX في الإنتاج الكمّي بسعر يبدأ من $85 للبطاقة، وFrigate صار يقيس شرائح MemryX وAxera أيضًا، فالمصادر البديلة الحقيقية موجودة."},{"refs":["uniview-ppe","hik-guanlan","ai-box-prices"],"to":"tech-box","head":{"en":"Camera makers now sell the box themselves","ar":"صانعو الكاميرات يبيعون الجهاز بأنفسهم"},"en":"Uniview sells a 16-channel edge box with hard hat, harness and vest checks built in. Hikvision added PPE detection and alarms written in a sentence. Ready-made AI boxes are listed from $199 to $9,999, and most add licences on top.","ar":"تبيع Uniview جهازًا طرفيًّا بـ16 قناة وفيه فحوص الخوذة وحزام الأمان والسترة. وأضافت Hikvision كشف معدّات الوقاية وإنذارات تُكتب بجملة. وأجهزة الذكاء الاصطناعي الجاهزة معروضة من $199 إلى $9,999، ومعظمها يضيف تراخيص فوق ذلك."},{"refs":["sighti","rime","wobot-pricing"],"to":"market","head":{"en":"Two Saudi startups are on the same ground","ar":"شركتان سعوديتان ناشئتان في الميدان نفسه"},"en":"Sighti, in Riyadh, sells camera analytics to restaurants on edge devices with Tailscale, the same design as Raqeeb's. RIME says it already runs on 6,000 cameras. Wobot still lists $9.99 per camera a month with no hardware to buy.","ar":"تبيع Sighti في الرياض تحليلات الكاميرات للمطاعم على أجهزة طرفية مع Tailscale، وهو تصميم رقيب نفسه. وتقول RIME إنها تعمل على 6,000 كاميرا. وما زالت Wobot تعرض $9.99 للكاميرا شهريًّا دون عتاد يُشترى."},{"refs":["jetson-price","pi-prices","minipc-price","memory-forecast"],"to":"tech-compute","head":{"en":"Memory prices moved every board","ar":"أسعار الذاكرة حرّكت كل اللوحات"},"en":"Jetson kits rose by up to 101%. The Raspberry Pi 5 with 8 GB went from $80 to $175, and an N150 mini PC costs $360–400. The AI cards did not follow: the Hailo-8 is still $169 and DEEPX starts at $85.","ar":"ارتفعت عدّات Jetson بما يصل إلى 101%. وصعد Raspberry Pi 5 بذاكرة 8 GB من $80 إلى $175، وحاسوب N150 المصغّر بسعر $360–400. أما بطاقات الذكاء الاصطناعي فلم تلحق بها: Hailo-8 ما زالت $169 وDEEPX تبدأ من $85."},{"refs":["ksa-cloud","saber","hailo-sourcing","saudi-cctv"],"to":"s-ksa-cloud","head":{"en":"GPUs inside the Kingdom, paperwork at the border","ar":"معالجات GPU داخل المملكة وأوراق عند الحدود"},"en":"HUMAIN's GPU cloud is live, and AWS and Azure open Saudi regions by the end of 2026, so a pool inside the Kingdom is an ordinary option. Importing the box needs SABER certificates, and whether Hailo cards can be imported is still unconfirmed.","ar":"سحابة GPU من HUMAIN تعمل، وAWS وAzure تفتحان منطقتين سعوديتين قبل نهاية 2026، فصار المجمّع داخل المملكة خيارًا عاديًّا. واستيراد الجهاز يحتاج إلى شهادات سابر، وإمكانية استيراد بطاقات Hailo ما زالت غير مؤكَّدة."},{"refs":["nl-search","frigate-018","vlm-small","detector-ranking"],"to":"tech-software","head":{"en":"Small language models reach the box","ar":"النماذج اللغوية الصغيرة تصل إلى الجهاز"},"en":"Recorders, and even $200 cameras, now find video from a typed sentence. Frigate's 0.18 release candidate runs a local language model. Of nine small vision-language models, only some carry a licence that allows a product, and RF-DETR now leads the licence-safe detectors.","ar":"المسجّلات، وحتى كاميرات بسعر $200، صارت تعثر على الفيديو من جملة مكتوبة. والنسخة المرشّحة 0.18 من Frigate تشغّل نموذجًا لغويًّا محليًّا. ومن تسعة نماذج رؤية ولغة صغيرة، بعضها فقط يحمل رخصة تسمح بمنتج، وRF-DETR يتصدّر الآن الكواشف الآمنة ترخيصًا."}],"signals":[{"id":"a-asus-launched-ugen300-and-ugen200-ai-accelerators-featuring-092e","cat":"hw","quad":null,"ring":null,"rel":"high","action":"act","date":"2026-10-15","tasks":["hardware","bench"],"src":[{"name":"Yahoo!ニュース","url":"https://news.yahoo.co.jp/articles/ef0017bb3e95f1e103a8cc29935791672b4be482","type":"news","date":"2026-10-15"}],"title":{"en":"ASUS launched UGen300 and UGen200 AI accelerators featuring Hailo chips","ar":"أطلقت ASUS مسرعات الذكاء الاصطناعي UGen300 و UGen200 المزودة بشرائح Hailo"},"why":{"en":"These accelerators provide low-power local AI processing suitable for adding vision capabilities to edge boxes.","ar":"توفر هذه المسرعات معالجة محلية للذكاء الاصطناعي منخفضة الطاقة ومناسبة لإضافة قدرات الرؤية لصناديق الحافة."},"subject":null,"next":{"en":"Test the ASUS UGen300 or UGen200 modules in the pilot benchmark setup.","ar":"اختبار وحدة ASUS UGen300 أو UGen200 في إعداد اختبار التجربة."},"kind":"signal","auto":true,"items":["asus-ugen300"],"isNew":true,"n":1},{"id":"uniview-ppe","cat":"market","quad":null,"ring":null,"rel":"high","action":"evaluate","date":"2026-10-12","tasks":["nohw","price"],"src":[{"name":"Uniview","type":"vendor","date":"2026-10-12","url":"https://global.uniview.com/us/Products/Edge_Intelligence/Smart_Box/Smart_Box/ECS-516S-SF-HD/"},{"name":"Uniview","type":"vendor","date":"2026-10-12","url":"https://www.uniview.com/Products/Edge_Intelligence/Smart_Box/"}],"title":{"en":"Uniview sells a 16-channel edge box with PPE checks built in","ar":"Uniview تبيع جهازًا طرفيًّا بـ16 قناة وفيه فحوص معدّات الوقاية"},"why":{"en":"The ECS-516S adds AI to 16 existing channels. It lists hard hat, safety harness and reflective clothing checks, people counting, and detection of falls, fights, smoking and forklift speeding. It draws 20 W or less and keeps alarm clips on a 1 TB drive. Smaller models take 4 and 8 channels. This is the Edge Box idea, sold by a company that already supplies the cameras.","ar":"يضيف ECS-516S الذكاء الاصطناعي إلى 16 قناة قائمة. ويدرج فحوص الخوذة وحزام الأمان والملابس العاكسة، وعدّ الأشخاص، وكشف السقوط والعراك والتدخين وتجاوز الرافعات الشوكية للسرعة. يستهلك 20 واط أو أقل ويحفظ مقاطع الإنذار على قرص 1 TB. وطرازان أصغر يستقبلان 4 و8 قنوات. هذه فكرة الجهاز الطرفي نفسها، تبيعها شركة تورّد الكاميرات أصلًا."},"subject":null,"next":{"en":"Get a price from a Saudi distributor and compare the PPE list","ar":"احصل على سعر من موزّع سعودي وقارن قائمة معدّات الوقاية"},"kind":"signal","isNew":false,"n":2},{"id":"minipc-price","cat":"hw","quad":"hw","ring":"trial","rel":"high","action":"act","date":"2026-10-10","tasks":["price","hardware"],"src":[{"name":"ComputingForGeeks","type":"news","date":"2026-10-10","url":"https://computingforgeeks.com/build-frigate-nvr-appliance/"},{"name":"Starry Hope","type":"news","date":"2026-09-30","url":"https://www.starryhope.com/minipcs/wildcat-lake-mini-pcs-budget-tier-shift-2026/"},{"name":"Starry Hope","type":"news","date":"2026-01-28","url":"https://www.starryhope.com/minipcs/dram-price-spike-mini-pc-raspberry-pi-2026/"}],"title":{"en":"Budget mini-PCs cost far more than a year ago","ar":"الحواسيب المصغّرة الاقتصادية أغلى بكثير من العام الماضي"},"why":{"en":"A Beelink S13 (N150) rose from $169 to $269 between August 2025 and January 2026. At the end of September an N100 box was listed at $229, and a build guide this month prices the Beelink Mini S13 at $360 to $400. The $120–160 prices in earlier estimates are out of date.","ar":"ارتفع سعر Beelink S13 (N150) من $169 إلى $269 بين أغسطس 2025 ويناير 2026. وفي نهاية سبتمبر عُرض حاسوب N100 بسعر $229، ودليل تجميع صدر هذا الشهر يسعّر Beelink Mini S13 بنحو $360 إلى $400. أسعار $120–160 الواردة في تقديرات سابقة لم تعد قائمة."},"subject":{"en":"N100 or N150 mini-PC as the base box","ar":"حاسوب N100 أو N150 المصغّر كجهاز أساسي"},"next":{"en":"Rebuild the cost sheet at today's prices","ar":"أعد بناء جدول التكلفة بأسعار اليوم"},"kind":"signal","isNew":false,"n":3},{"id":"igpu-filter","cat":"pipe","quad":"flow","ring":"trial","rel":"high","action":"evaluate","date":"2026-10-10","tasks":["ingest","bench","hardware"],"src":[{"name":"ComputingForGeeks","type":"news","date":"2026-10-10","url":"https://computingforgeeks.com/build-frigate-nvr-appliance/"}],"title":{"en":"An N150's own graphics chip can run the Tier 2 filter","ar":"شريحة الرسوميات في N150 تكفي لتشغيل مرشّح المستوى 2"},"why":{"en":"Frigate's published figures put YOLOv9-small at 320 px at 24 ms on the N150's graphics chip through OpenVINO, about 42 detections a second. Twenty cameras at one to two frames a second need 20 to 40. Tier 2 may need no add-in card at all.","ar":"أرقام Frigate المنشورة تضع YOLOv9-small بدقة 320 بكسل عند 24 مللي ثانية على شريحة رسوميات N150 عبر OpenVINO، أي نحو 42 كشفًا في الثانية. عشرون كاميرا بإطار إلى إطارين في الثانية تحتاج إلى 20–40. قد لا يحتاج المستوى 2 إلى أي بطاقة إضافية."},"subject":{"en":"OpenVINO on the built-in graphics for Tier 2","ar":"OpenVINO على الرسوميات المدمجة للمستوى 2"},"next":{"en":"Run your nano filter on 20 sub-streams","ar":"شغّل مرشّحك الصغير على 20 بثًّا فرعيًّا"},"kind":"signal","isNew":false,"n":4},{"id":"a-crsi-edge-launches-a-fanless-surveillance-pc-with-intel-arro-45a6","cat":"hw","quad":null,"ring":null,"rel":"high","action":"evaluate","date":"2026-10-10","tasks":["hardware"],"src":[{"name":"VideoCardz.com","url":"https://videocardz.com/newz/this-fanless-security-camera-pc-packs-intel-arrow-lake-and-arc-graphics-enough-to-play-some-games","type":"news","date":"2026-10-10"}],"title":{"en":"CRSi Edge launches a fanless surveillance PC with Intel Arrow Lake.","ar":"تطلق CRSi Edge حاسوب مراقبة بدون مروحة مع معالجات Intel Arrow Lake."},"why":{"en":"Fanless industrial PCs with built-in PoE ports can serve as on-site edge boxes for CCTV cameras.","ar":"تعتبر الحواسيب الصناعية بدون مروحة والتي تحتوي على منافذ PoE مدمجة بمثابة صندوق حافة محلي لكاميرات المراقبة."} t for cloud video","ar":"ONVIF تنشر مسودة Profile V للفيديو السحابي"},"why":{"en":"A conforming camera opens its own secure outbound connection to a cloud system and streams over WebRTC, with events and OAuth 2.0. ONVIF expects to finalise it by the end of 2026. In the long run this is the path with no box, but nothing says existing cameras will get it.","ar":"الكاميرا المتوافقة تفتح بنفسها اتصالًا صادرًا آمنًا بالنظام السحابي وتبثّ عبر WebRTC، مع الأحداث وOAuth 2.0. تتوقّع ONVIF إقراره نهائيًّا قبل نهاية 2026. على المدى البعيد هذا هو المسار الذي لا يحتاج إلى جهاز، لكن لا شيء يؤكّد أن الكاميرات الحالية ستحصل عليه."},"subject":{"en":"ONVIF Profile V","ar":"ONVIF Profile V"},"next":{"en":"Re-check when the final version is out","ar":"راجعه عند صدور النسخة النهائية"},"kind":"signal","isNew":false,"n":61},{"id":"aws-panorama-end","cat":"market","quad":null,"ring":null,"rel":"medium","action":"watch","date":"2026-05-31","tasks":["nohw","fleet"],"src":[{"name":"AWS documentation","type":"docs","date":null,"url":"https://docs.aws.amazon.com/panorama/latest/dev/panorama-end-of-support.html"}],"title":{"en":"AWS switched off its own camera AI box","ar":"AWS أوقفت جهازها للذكاء الاصطناعي على الكاميرات"},"why":{"en":"AWS Panorama was a box that ran computer vision on a site's existing IP cameras. AWS stopped taking new customers on 20 May 2025 and ended the service on 31 May 2026. Because the boxes depended on the cloud service, they stopped working that day. AWS now points customers to ordinary NVIDIA Jetson devices or edge servers, and tells them to add full disk encryption and safe storage for camera passwords.","ar":"كان AWS Panorama جهازًا يشغّل الرؤية الحاسوبية على كاميرات IP القائمة في الموقع. توقّفت AWS عن قبول عملاء جدد في 20 مايو 2025 وأنهت الخدمة في 31 مايو 2026. ولأن الأجهزة كانت تعتمد على الخدمة السحابية، توقّفت عن العمل في ذلك اليوم. وتوجّه AWS عملاءها الآن إلى أجهزة NVIDIA Jetson العادية أو الخوادم الطرفية، وتطلب منهم إضافة التشفير الكامل للقرص وتخزينًا آمنًا لكلمات مرور الكاميرات."},"subject":null,"next":{"en":"Make sure the box keeps working when a service it uses goes away","ar":"تأكّد من أن الجهاز يواصل العمل إذا اختفت خدمة يستخدمها"},"kind":"signal","isNew":false,"n":62},{"id":"ul-deepx-export","cat":"model","quad":"model","ring":"trial","rel":"medium","action":"evaluate","date":"2026-05","tasks":["compile","bench"],"src":[{"name":"Ultralytics Docs","type":"docs","url":"https://docs.ultralytics.com/integrations/deepx/"}],"title":{"en":"Ultralytics adds a DEEPX export as well","ar":"Ultralytics تضيف تصديرًا إلى DEEPX أيضًا"},"why":{"en":"YOLOv8, YOLO11 and YOLO26 now export to DEEPX's format from an x86 Linux PC, 8-bit only. On a Raspberry Pi 5 with a DX-M1, YOLO26n ran in 34.6 ms per image and lost about one point of mAP. Both pilot cards can be fed from the same training code.","ar":"يمكن الآن تصدير YOLOv8 وYOLO11 وYOLO26 إلى صيغة DEEPX من حاسوب Linux بمعمارية x86، وبدقة 8 بت فقط. على Raspberry Pi 5 مع DX-M1 عمل YOLO26n في 34.6 مللي ثانية للصورة وخسر نحو نقطة واحدة من mAP. يمكن تغذية بطاقتَي المشروع التجريبي من شيفرة التدريب نفسها."},"subject":{"en":"Ultralytics export to DEEPX","ar":"تصدير Ultralytics إلى DEEPX"},"next":{"en":"Export the same model for both cards","ar":"صدِّر النموذج نفسه للبطاقتين"},"kind":"signal","isNew":false,"n":63},{"id":"pi-prices","cat":"hw","quad":"hw","ring":"hold","rel":"medium","action":"watch","date":"2026-04-28","tasks":["hardware","price"],"src":[{"name":"Raspberry Pi","type":"vendor","date":"2026-02-02","url":"https://www.raspberrypi.com/news/more-memory-driven-price-rises/"},{"name":"CNX Software","type":"news","date":"2026-04-28","url":"https://www.cnx-software.com/?p=169435"},{"name":"Gigazine","type":"news","date":"2026-04-02","url":"https://www.gigazine.net/gsc_news/en/20260402-raspberry-pi-price-increases"}],"title":{"en":"Raspberry Pi 5 prices have more than doubled","ar":"أسعار Raspberry Pi 5 زادت على الضعف"},"why":{"en":"Three rises since December 2025 took the 8 GB board from $80 to $175 and the 16 GB board from $120 to $305. Raspberry Pi blames memory costs and calls the rises temporary. Its AI HAT+ 2 add-on went from $130 to $180. A Raspberry Pi with a Hailo board now costs as much as an Intel mini PC, and it still decodes H.264 video in software.","ar":"ثلاث زيادات منذ ديسمبر 2025 رفعت لوحة 8 GB من $80 إلى $175 ولوحة 16 GB من $120 إلى $305. تعزو Raspberry Pi ذلك إلى تكلفة الذاكرة وتصف الزيادات بأنها مؤقتة. وارتفعت إضافتها AI HAT+ 2 من $130 إلى $180. فصار Raspberry Pi مع لوحة Hailo يكلّف ما يكلّفه حاسوب Intel مصغّر، وهو ما زال يفكّ ترميز H.264 برمجيًّا."},"subject":{"en":"Raspberry Pi 5 as the box","ar":"Raspberry Pi 5 جهازًا طرفيًّا"},"next":{"en":"Leave the Raspberry Pi off the shortlist","ar":"استبعد Raspberry Pi من القائمة المختصرة"},"kind":"signal","isNew":false,"n":64},{"id":"tailscale-pricing","cat":"net","quad":"flow","ring":"adopt","rel":"medium","action":"evaluate","date":"2026-04-08","tasks":["connect","price"],"src":[{"name":"Tailscale","type":"vendor","date":"2026-04-08","url":"https://tailscale.com/blog/pricing-v4"},{"name":"Tailscale","type":"vendor","url":"https://tailscale.com/pricing"}],"title":{"en":"Tailscale moves to per-seat pricing and counts unattended devices","ar":"Tailscale تنتقل إلى التسعير بالمقعد وتحتسب الأجهزة غير المراقَبة"},"why":{"en":"Business plans are now $8 or $18 per user a month. Fifty tagged devices are included and each extra one costs $1 a month. If each box is a tagged device, 500 boxes come to roughly $450 a month. The limits are not enforced yet, and existing plans keep their price for at least 12 months.","ar":"خطط الأعمال صارت $8 أو $18 للمستخدم شهريًّا. تتضمّن 50 جهازًا موسومًا، وكل جهاز إضافي بسعر $1 شهريًّا. إذا سُجّل كل جهاز طرفي كجهاز موسوم فإن 500 جهاز تكلّف نحو $450 شهريًّا. الحدود لم تُطبَّق بعد، والخطط الحالية تحتفظ بسعرها 12 شهرًا على الأقل."},"subject":{"en":"Tailscale as the tunnel","ar":"Tailscale كنفق الاتصال"},"next":{"en":"Model the cost at 100 and 500 boxes","ar":"احسب التكلفة عند 100 و500 جهاز"},"kind":"signal","isNew":false,"n":65},{"id":"peer-relays","cat":"net","quad":"flow","ring":"trial","rel":"medium","action":"evaluate","date":"2026-02-18","tasks":["latency","connect"],"src":[{"name":"Tailscale","type":"vendor","date":"2026-02-18","url":"https://tailscale.com/blog/peer-relays-ga"}],"title":{"en":"Tailscale Peer Relays reach general availability","ar":"ميزة Peer Relays من Tailscale أصبحت متاحة للجميع"},"why":{"en":"When a direct connection is blocked, traffic falls back to Tailscale's shared relays. You can now run your own relay on any node, on every plan. If part of the 5-second delay comes from relayed connections, a relay beside the GPU pool is a cheap test.","ar":"عند تعذّر الاتصال المباشر تمرّ البيانات عبر مرحِّلات Tailscale المشتركة. يمكنك الآن تشغيل مرحِّل خاص بك على أي عقدة وفي كل الخطط. إذا كان جزء من تأخير الخمس ثوانٍ ناتجًا عن اتصالات مُرحَّلة، فمرحِّل بجانب مجمّع الـGPU اختبار قليل التكلفة."},"subject":{"en":"Your own relay beside the GPU pool","ar":"مرحِّل خاص بجانب مجمّع الـGPU"},"next":{"en":"Count how many sites are relayed today","ar":"احصِ المواقع التي تمرّ عبر مرحِّل اليوم"},"kind":"signal","isNew":false,"n":66},{"id":"axera-box","cat":"hw","quad":"hw","ring":"trial","rel":"medium","action":"evaluate","date":"2026-02-06","tasks":["hardware","ingest"],"src":[{"name":"CNX Software","type":"news","date":"2026-02-06","url":"https://www.cnx-software.com/2026/02/06/199-m5stack-ai-pyramid-computing-box-linux-ai-mini-pc-is-based-on-axera-ax8850-soc/"},{"name":"Frigate documentation","type":"docs","date":"2026-10-12","url":"https://docs.frigate.video/frigate/hardware"}],"title":{"en":"A $199 box decodes 16 streams and has a 24 TOPS processor","ar":"جهاز بسعر $199 يفكّ ترميز 16 بثًّا وفيه معالج بقدرة 24 TOPS"},"why":{"en":"The M5Stack AI Pyramid uses the Axera AX8850 chip: eight cores, a 24 TOPS neural processor, hardware decoding of 16 full-HD channels and two network ports. Frigate's documentation now lists this chip family and measures a tiny YOLOv9 at about 4 ms. The box ships with a default password of 123456, and its software is young.","ar":"يستخدم M5Stack AI Pyramid شريحة Axera AX8850: ثماني أنوية ومعالج عصبي بقدرة 24 TOPS وفكّ ترميز عتادي لـ16 قناة بدقة 1080p ومنفذا شبكة. ووثائق Frigate صارت تدرج هذه الفئة من الشرائح وتقيس نموذج YOLOv9 الصغير جدًّا بنحو 4 مللي ثانية. والجهاز يُشحن بكلمة مرور افتراضية هي 123456، وبرمجياته حديثة العهد."},"subject":{"en":"Axera AX8850 boxes","ar":"أجهزة Axera AX8850"},"next":{"en":"Buy one and measure 16 sub-streams","ar":"اشترِ واحدًا وقِس 16 بثًّا فرعيًّا"},"kind":"signal","isNew":false,"n":67},{"id":"yolo26","cat":"model","quad":"model","ring":"trial","rel":"medium","action":"evaluate","date":"2026-01","tasks":["compile","bench"],"src":[{"name":"Ultralytics Docs","type":"docs","url":"https://docs.ultralytics.com/models/yolo26/"},{"name":"Ultralytics Docs","type":"docs","url":"https://docs.ultralytics.com/integrations/hailo"}],"title":{"en":"YOLO26 removes NMS and DFL, which simplifies export","ar":"YOLO26 يستغني عن NMS وDFL فيتبسّط التصدير"},"why":{"en":"Released in January 2026. The nano model runs up to 43% faster on CPU than YOLO11n, and YOLO26m reaches 53.1 mAP. It exports to Hailo, DEEPX and Rockchip formats, but on Hailo it lost more accuracy under 8-bit quantisation than YOLOv8 did.","ar":"صدر في يناير 2026. النموذج الأصغر nano أسرع على المعالج المركزي بما يصل إلى 43% من YOLO11n، ويبلغ YOLO26m دقة 53.1 mAP. يمكن تصديره إلى صيغ Hailo وDEEPX وRockchip، لكنه خسر على Hailo من دقته مع تكميم 8 بت أكثر مما خسر YOLOv8."},"subject":{"en":"YOLO26 as the next model family","ar":"YOLO26 كعائلة النماذج التالية"},"next":{"en":"Compare v8m and 26m after quantisation","ar":"قارن v8m و26m بعد التكميم"},"kind":"signal","isNew":false,"n":68},{"id":"rf-detr","cat":"research","quad":"model","ring":"trial","rel":"medium","action":"evaluate","date":"2025-11","tasks":["license","compile"],"venue":"ICLR 2026","lab":"Roboflow","code":true,"src":[{"name":"GitHub: roboflow/rf-detr","type":"paper","url":"https://github.com/roboflow/rf-detr"}],"title":{"en":"RF-DETR: Real-Time Detection Transformer","ar":"RF-DETR: Real-Time Detection Transformer"},"why":{"en":"A real-time detector whose medium model reaches 54.7 AP on COCO at 4.4 ms on a T4 GPU. The code and the nano-to-large models are Apache 2.0, so it carries none of the AGPL questions.","ar":"كاشف فوري يبلغ نموذجه المتوسط 54.7 AP على COCO في 4.4 مللي ثانية على GPU من نوع T4. الشيفرة والنماذج من nano إلى large برخصة Apache 2.0، فلا ترد عليه أسئلة AGPL."},"exp":{"en":"Train RF-DETR-M on one PPE service and compare it with your medium YOLO on a cluster GPU. Then try compiling it for the box. Ultralytics' Hailo export lists RT-DETR as unsupported, so expect conversion work for a transformer detector.","ar":"درِّب RF-DETR-M على خدمة واحدة لمعدّات الوقاية وقارنه بنموذج YOLO المتوسط لديك على أحد معالجات المجمّع. ثم جرِّب تجميعه للجهاز. تصدير Ultralytics إلى Hailo يذكر أن RT-DETR غير مدعوم، فتوقّع جهدًا في تحويل كاشف من نوع Transformer."},"subject":{"en":"RF-DETR as a permissively licensed detector","ar":"RF-DETR ككاشف برخصة متساهلة"},"next":{"en":"Train it on one service","ar":"درِّبه على خدمة واحدة"},"kind":"research","isNew":false,"n":69},{"id":"quant-robust","cat":"research","quad":"model","ring":"adopt","rel":"medium","action":"act","date":"2025-08","tasks":["compile","bench"],"venue":"arXiv 2508.19600","lab":"Karimov, Imani, Kazakov","code":false,"src":[{"name":"arXiv","type":"paper","url":"https://arxiv.org/abs/2508.19600"}],"title":{"en":"Quantization Robustness to Input Degradations for Object Detection","ar":"Quantization Robustness to Input Degradations for Object Detection"},"why":{"en":"YOLO models from nano to extra-large were tested in four numeric formats against noise, blur, low contrast and JPEG compression. Static 8-bit engines ran 1.5 to 3.3 times faster and lost about 3–7% mAP on clean images. Calibrating on degraded images did not reliably help.","ar":"اختُبرت نماذج YOLO من nano إلى extra-large بأربع صيغ رقمية أمام الضجيج والتمويه وضعف التباين وضغط JPEG. المحرّكات الثابتة بدقة 8 بت كانت أسرع بمقدار 1.5 إلى 3.3 مرة وخسرت نحو 3–7% من mAP على الصور النظيفة. والمعايرة بصور متدهورة لم تُفد بصورة موثوقة."},"exp":{"en":"After quantising, measure accuracy on your worst cameras, with steam, glare and low contrast, and not only on a clean validation set.","ar":"بعد التكميم، قِس الدقة على أسوأ كاميراتك حيث البخار والوهج وضعف التباين، لا على مجموعة تحقّق نظيفة فقط."},"subject":{"en":"8-bit accuracy checks on bad footage","ar":"فحص دقة 8 بت على اللقطات الرديئة"},"next":{"en":"Add bad-camera clips to the test set","ar":"أضف مقاطع الكاميرات الرديئة إلى مجموعة الاختبار"},"kind":"research","isNew":false,"n":70},{"id":"spotvlm","cat":"research","quad":"model","ring":"assess","rel":"medium","action":"evaluate","date":"2025-08","tasks":["services"],"venue":"arXiv 2508.12638","lab":"Tsinghua University, Beijing Jiaotong University, Inspur","code":false,"src":[{"name":"arXiv","type":"paper","url":"https://arxiv.org/abs/2508.12638"}],"title":{"en":"SpotVLM: Cloud-edge Collaborative Real-time VLM based on Context Transfer","ar":"SpotVLM: Cloud-edge Collaborative Real-time VLM based on Context Transfer"},"why":{"en":"A small vision-language model at the edge handles every frame, and selected key frames go to a large model in the cloud. The large model's late answers are reused as context for the small one. On one driving dataset the score rose from 58.19% for the small model alone to 69.96%, and the gain held with cloud delays of up to 9 seconds. No code release is mentioned.","ar":"نموذج رؤية ولغة صغير عند الطرف يعالج كل إطار، وتُرسَل إطارات مفتاحية مختارة إلى نموذج كبير في السحابة. وإجابات النموذج الكبير المتأخّرة يُعاد استخدامها سياقًا للصغير. على مجموعة بيانات قيادة ارتفعت النتيجة من 58.19% للنموذج الصغير وحده إلى 69.96%، وبقي التحسّن مع تأخّر السحابة حتى 9 ثوانٍ. ولا ذكر لنشر الشيفرة."},"exp":{"en":"Run a small model on every frame at the box and send only key frames to a large model on the GPU pool. Keep the pool's last answer as context while waiting for the next one. Measure how many false alerts this removes on one service.","ar":"شغّل نموذجًا صغيرًا على كل إطار في الجهاز وأرسل الإطارات المفتاحية فقط إلى نموذج كبير على مجمّع GPU. واحتفظ بآخر إجابة من المجمّع سياقًا ريثما تصل التالية. وقِس كم إنذارًا كاذبًا يزيله ذلك في خدمة واحدة."},"subject":{"en":"A small model at the site with a large model in the pool","ar":"نموذج صغير في الموقع مع نموذج كبير في المجمّع"},"next":{"en":"Prototype it on one service","ar":"ابنِ نموذجًا أوليًّا له على خدمة واحدة"},"kind":"research","isNew":false,"n":71},{"id":"yoloe","cat":"research","quad":"model","ring":"assess","rel":"medium","action":"evaluate","date":"2025-03","tasks":["services"],"venue":"ICCV 2025","lab":"Tsinghua University","code":true,"src":[{"name":"CVF Open Access","type":"paper","url":"https://openaccess.thecvf.com/content/ICCV2025/html/Wang_YOLOE_Real-Time_Seeing_Anything_ICCV_2025_paper.html"}],"title":{"en":"YOLOE: Real-Time Seeing Anything","ar":"YOLOE: Real-Time Seeing Anything"},"why":{"en":"One model that detects from a text prompt, an example image, or no prompt at all. It beats YOLO-Worldv2-S by 3.5 AP on LVIS and runs 1.4 times faster. The text prompt adds no cost at inference.","ar":"نموذج واحد يكشف انطلاقًا من وصف نصي أو صورة مثال أو دون أي توجيه. يتفوّق على YOLO-Worldv2-S بمقدار 3.5 AP على LVIS وهو أسرع بمقدار 1.4 مرة. والوصف النصي لا يضيف أي تكلفة عند التشغيل."},"exp":{"en":"Prototype two rare services, such as a blocked exit or a spill, with text prompts before training dedicated models. Ultralytics' Hailo export lists YOLOE as unsupported, so run this on the GPU pool.","ar":"ابنِ نموذجًا أوليًّا لخدمتين نادرتين، مثل مخرج مسدود أو انسكاب، بأوصاف نصية قبل تدريب نماذج مخصّصة. تصدير Ultralytics إلى Hailo يذكر أن YOLOE غير مدعوم، فشغّله على مجمّع الـGPU."},"subject":{"en":"Text-prompted detection for rare services","ar":"الكشف بالوصف النصي للخدمات النادرة"},"next":{"en":"Prototype two rare services","ar":"ابنِ نموذجًا أوليًّا لخدمتين نادرتين"},"kind":"research","isNew":false,"n":72},{"id":"saudi-cctv-90","cat":"rules","quad":null,"ring":null,"rel":"medium","action":"evaluate","date":"2023-05-22","tasks":["rules"],"src":[{"name":"SAFE Security","type":"news","date":"2023-05-22","url":"https://www.safesecurity.sa/en/media-center/blogs/Pages/Surveillance-Cameras-New-Regulation-.aspx"},{"name":"Qanoniah","type":"law","date":null,"url":"https://qanoniah.com/en/File/DgeA8p06zOoAq1Xo49mr5VqBK-Law-on-the-Use-of-Surveillance-Cameras-and-its-Executive-Regulation"}],"title":{"en":"Saudi camera rules: recordings kept for 90 days, says one summary","ar":"أنظمة الكاميرات السعودية: حفظ التسجيلات 90 يومًا، بحسب أحد الملخّصات"},"why":{"en":"A Saudi security company's summary of the camera regulation lists a SAR 5,000 fine for not keeping recordings for 90 days, and SAR 20,000 for transferring or publishing them. The law itself (Royal Decree M/34) says only that recordings are kept for the periods set in a separate requirements document, which was not found. Food-service establishments are covered. The Edge Box leaves recording to the site's own recorder, so the 90 days fall on that recorder, not on the box.","ar":"يذكر ملخّص لأنظمة الكاميرات أعدّته شركة أمن سعودية غرامة 5,000 ريال لعدم حفظ التسجيلات 90 يومًا، و20,000 ريال لنقلها أو نشرها. أمّا النظام نفسه (المرسوم الملكي م/34) فيقول فقط إن التسجيلات تُحفظ للمدد المحدّدة في وثيقة اشتراطات منفصلة لم يُعثر عليها. ومنشآت تقديم الطعام مشمولة. والجهاز الطرفي يترك التسجيل لمسجّل الموقع نفسه، فالتسعون يومًا تقع على ذلك المسجّل لا على الجهاز."},"subject":null,"next":{"en":"Confirm the period in the requirements document","ar":"تأكّد من المدة في وثيقة الاشتراطات"},"kind":"signal","isNew":false,"n":73},{"id":"gemel","cat":"research","quad":"model","ring":"assess","rel":"medium","action":"evaluate","date":"2023-04","tasks":["services"],"venue":"NSDI 2023","lab":"UCLA /* Isometric drawing kit and the device drawings. Plain script, no dependencies.
   World axes: x runs down-right on screen, y runs down-left, z runs up.
   A box shows three faces: its top, its left-front face (the y+d side) and its right-front face (the x+w side).
   Scenes are painted back to front in the order they are written. */
const Art = (() => {
  const C = Math.cos(Math.PI / 6), S = 0.5;
  const n2 = (n) => String(Math.round(n * 100) / 100);
